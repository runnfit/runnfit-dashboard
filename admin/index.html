<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#093692">
<title>회원앱 관리 · 런앤핏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --b:#093692; --b2:#2563EB; --ink:#111827; --muted:#6B7280; --line:#E5E9F2; --bg:#F4F7FB; --soft:#E3E9FF; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:'Noto Sans KR',system-ui,sans-serif; color:var(--ink); background:var(--bg); word-break:keep-all; font-size:14px; }
  button,input,textarea,select{ font-family:inherit; font-size:inherit; }
  button{ cursor:pointer; }
  .hidden{ display:none !important; }
  .top{ height:60px; background:var(--b); color:#fff; display:flex; align-items:center; gap:14px; padding:0 24px; position:sticky; top:0; z-index:5; }
  .logo{ height:24px; width:auto; display:block; }
  .top .ttl{ font-weight:700; opacity:.9; padding-left:14px; border-left:1px solid rgba(255,255,255,.3); }
  .nav{ display:flex; gap:4px; background:rgba(255,255,255,.1); border-radius:10px; padding:4px; margin-left:12px; }
  .nav button{ border:0; background:transparent; color:#fff; font-weight:700; padding:7px 14px; border-radius:7px; display:flex; align-items:center; gap:6px; }
  .nav button.on{ background:#fff; color:var(--b); }
  .nav button[disabled]{ opacity:.5; cursor:default; }
  .badge{ background:#EF4444; color:#fff; border-radius:9px; padding:0 6px; font-size:11px; font-weight:900; line-height:18px; }
  .top .me{ margin-left:auto; display:flex; align-items:center; gap:10px; font-size:13px; }
  .top .me button{ border:0; background:rgba(255,255,255,.15); color:#fff; border-radius:8px; padding:6px 10px; font-weight:700; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; }
  .live i{ width:8px; height:8px; border-radius:50%; background:#4ADE80; }
  .demo{ background:#FFD54A; color:#5B4300; border-radius:6px; padding:3px 8px; font-size:12px; font-weight:900; }
  main{ padding:18px 24px 30px; max-width:1360px; margin:0 auto; }
  .stats{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
  .stat{ background:#fff; border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(17,24,39,.06); }
  .stat .l{ font-size:12.5px; color:var(--muted); font-weight:700; }
  .stat .v{ font-size:26px; font-weight:900; margin-top:2px; }
  .stat .s{ font-size:12px; color:var(--muted); margin-top:2px; }
  .bar{ height:6px; background:#EEF1F6; border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--b); }
  .card{ background:#fff; border-radius:12px; box-shadow:0 1px 2px rgba(17,24,39,.06); }
  .split{ display:grid; grid-template-columns:420px minmax(0,1fr); gap:16px; margin-top:16px; align-items:start; }
  .list{ padding:8px; max-height:calc(100vh - 230px); overflow:auto; }
  .lhead{ display:flex; align-items:center; gap:6px; padding:8px 8px 10px; flex-wrap:wrap; }
  .lhead b{ font-size:15px; margin-right:auto; }
  .chip{ border:0; background:#F1F4FA; color:#374151; border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:700; }
  .chip.on{ background:var(--b); color:#fff; }
  .item{ display:flex; gap:11px; padding:11px 12px; border-radius:10px; cursor:pointer; align-items:flex-start; }
  .item:hover{ background:#F6F8FD; }
  .item.on{ background:#EEF4FF; box-shadow:inset 3px 0 0 var(--b2); }
  .ico{ width:36px; height:36px; border-radius:9px; background:var(--soft); display:flex; align-items:center; justify-content:center; flex:none; }
  .item .t{ font-weight:700; font-size:14px; }
  .item .d{ font-size:12px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:290px; }
  .tag{ display:inline-block; border-radius:5px; padding:1px 7px; font-size:11.5px; font-weight:700; }
  .t-new{ background:#FEE2E2; color:#B91C32; } .t-done{ background:var(--soft); color:var(--b); }
  .empty{ color:var(--muted); text-align:center; padding:40px 10px; }
  .panel{ padding:22px 24px; min-height:420px; }
  .panel h2{ font-size:19px; margin:0; }
  .kv{ display:grid; grid-template-columns:110px 1fr; gap:8px 12px; margin-top:16px; font-size:14px; }
  .kv dt{ color:var(--muted); font-weight:700; } .kv dd{ margin:0; }
  .quote{ background:var(--bg); border-radius:10px; padding:14px 16px; font-size:15px; line-height:1.6; margin-top:14px; white-space:pre-line; }
  textarea{ width:100%; border:2px solid #C7D3EE; border-radius:10px; padding:12px; min-height:90px; line-height:1.55; resize:vertical; }
  textarea:focus,input:focus{ outline:none; border-color:var(--b2); }
  .btn{ height:40px; padding:0 16px; border:0; border-radius:9px; background:var(--b); color:#fff; font-weight:900; }
  .btn.sec{ background:var(--soft); color:var(--b); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .row{ display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .msg{ font-size:13px; font-weight:700; margin-left:auto; } .msg.ok{ color:#15803D; } .msg.err{ color:#B91C32; }
  .tbl{ width:100%; border-collapse:collapse; }
  .tbl th{ text-align:left; font-size:12.5px; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line); background:#FAFBFE; position:sticky; top:0; cursor:pointer; user-select:none; }
  .tbl td{ padding:10px 12px; border-bottom:1px solid #F0F2F7; font-size:13.5px; }
  .tbl tr:hover td{ background:#F8FAFE; }
  .nick{ font-weight:700; display:inline-flex; align-items:center; gap:7px; }
  .dot{ width:12px; height:12px; border-radius:50%; flex:none; display:inline-block; }
  .search{ height:38px; border:2px solid #D5DCE8; border-radius:9px; padding:0 12px; width:260px; }
  .coach{ width:28px; height:28px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:6px; background:var(--b); }
  .soon{ background:#fff; border-radius:12px; padding:40px; text-align:center; color:var(--muted); margin-top:16px; }
  /* 로그인 */
  body.embed .top .logo, body.embed .top .ttl{ display:none; }
  body.embed .top{ height:52px; }
  body.embed .nav{ margin-left:0; }
  .login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#093692,#2563EB); }
  .login .box{ background:#fff; border-radius:16px; padding:30px 28px; width:min(380px,100%); }
  .login h1{ margin:0; font-size:22px; } .login p{ color:var(--muted); margin:6px 0 18px; font-size:13.5px; line-height:1.5; }
  .login label{ display:block; font-weight:700; font-size:13px; margin:12px 0 6px; }
  .login input{ width:100%; height:46px; border:2px solid #D5DCE8; border-radius:10px; padding:0 12px; }
  .login .btn{ width:100%; height:48px; margin-top:18px; font-size:15px; }
  .login .demoLink{ display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--b); }
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div style="width:min(380px,100%)">
  <img src="logo.png" alt="RUN N FIT" style="height:30px;display:block;margin:0 auto 18px">
  <form class="box" id="loginForm">
    <h1>회원앱 관리</h1>
    <p>직원 계정으로 들어와요.<br>(회원앱 연결할 때 쓰는 Firebase 직원 계정 · 다짐 계정 아님)</p>
    <label for="em">이메일</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">들어가기</button>
    <div class="msg err" id="loginMsg" style="margin-top:10px;text-align:center"></div>
    <a class="demoLink" id="demoLink" href="?demo">로그인 없이 예시 화면 보기 ›</a>
  </form>
  </div>
</div>

<div id="shell" class="hidden">
  <header class="top">
    <img class="logo" src="logo.png" alt="RUN N FIT"><span class="ttl">회원앱 관리</span><span class="ttl" id="embedNote" style="display:none"></span>
    <nav class="nav" aria-label="화면">
      <button data-view="todo" class="on">할 일 <span class="badge hidden" id="todoBadge">0</span></button>
      <button data-view="members">가입 회원</button>
      <button data-view="soon" title="곧 열려요">공지 · 주간 WOD</button>
    </nav>
    <div class="me"><span id="demoTag" class="demo hidden">예시 화면</span><span class="live"><i></i>실시간</span><span id="who"></span><a id="popOut" href="./" target="runfit_admin" rel="noopener" style="display:none;color:#fff;font-weight:700;font-size:12.5px;text-decoration:none;background:rgba(255,255,255,.15);border-radius:8px;padding:6px 10px">새 창 ↗</a><button id="logout" type="button">나가기</button></div>
  </header>
  <main>
    <section class="stats" id="stats"></section>

    <section id="v-todo">
      <div class="split">
        <div class="card list">
          <div class="lhead"><b>할 일</b>
            <button class="chip on" data-f="new">처리 전</button><button class="chip" data-f="done">처리 완료</button><button class="chip" data-f="all">전체</button></div>
          <div class="lhead" style="padding-top:0">
            <button class="chip on" data-k="all">모두</button><button class="chip" data-k="help">도움 요청</button><button class="chip" data-k="voice">런앤핏에 한마디</button><button class="chip" data-k="inq">체험·상담</button><button class="chip" data-k="goal">출석 목표</button></div>
          <div id="items"></div>
        </div>
        <div class="card panel" id="panel"></div>
      </div>
    </section>

    <section id="v-members" class="hidden">
      <div class="card" style="margin-top:16px">
        <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap">
          <b style="font-size:16px">앱 가입 회원 <span id="mCount" style="color:var(--b)"></span></b>
          <button class="chip on" data-m="joined">가입한 회원</button><button class="chip" data-m="not">아직 안 한 회원</button>
          <input class="search" id="mSearch" placeholder="이름 · 닉네임 · 전화 뒤 4자리" style="margin-left:auto">
        </div>
        <div style="max-height:calc(100vh - 250px);overflow:auto">
          <table class="tbl"><thead id="mHead"></thead><tbody id="mBody"></tbody></table>
        </div>
      </div>
    </section>

    <section id="v-soon" class="hidden">
      <div class="soon"><b style="font-size:17px;color:var(--ink)">공지 · 주간 WOD 올리기는 다음 단계에서 열려요</b><br><br>회원앱 홈의 '오늘의 운동' 자리는 주간 WOD로 바뀔 예정이에요.</div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, limit, getDocs, getDoc, doc, onSnapshot, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const DEMO = /[?&]demo/.test(location.search);
const EMBED = /[?&]embed/.test(location.search) && window.parent !== window;
if(EMBED){ document.getElementById('demoLink').href = '?demo&embed'; document.body.classList.add('embed'); document.getElementById('popOut').style.display = ''; }
const B = '#093692';
const $ = (id)=> document.getElementById(id);
const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, (c)=> ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KST = ()=> new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const BELT = [[100, '검', '#111827'], [50, '빨', '#B91C32'], [30, '파', '#093692'], [10, '노', '#FFD54A'], [0, '흰', '#CBD5E1']];
const belt = (t)=> BELT.find((b)=> (t || 0) >= b[0]);
function weekCount(m){
  const t = KST(), dow = (new Date(t + 'T12:00:00+09:00').getUTCDay() + 6) % 7;
  const mon = new Date(Date.parse(t + 'T12:00:00+09:00') - dow * 864e5 + 9 * 3600e3).toISOString().slice(0, 10);
  const days = new Set(Array.isArray(m.recentDays) ? m.recentDays : []); if(m.lastAttend === t) days.add(t);
  return [...days].filter((d)=> d >= mon && d <= t).length;
}
const COACH_PHOTO = { '런관장': 'run.jpg', '가온코치': 'gaon.jpg', '하루코치': 'haru.jpg', '로라코치': 'laura.jpg' };
const ICON = {
  help: '<path d="M12 3.5a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4z"/><path d="M5.5 20c.6-3.8 3.2-6 6.5-6s5.9 2.2 6.5 6"/><path d="M3 11h3M18 11h3M4.5 9.5v3M19.5 9.5v3"/>',
  pt: '<path d="M4 5.5h16v10H9l-4 3.5v-3.5H4z"/><path d="M8 10.5h8"/>',
  voice: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  goal: '<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>',
  inq: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
};
const ico = (k, bg)=> '<span class="ico" style="' + (bg ? 'background:' + bg : '') + '"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="' + B + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg></span>';
const tsMs = (t)=> t && t.toDate ? t.toDate().getTime() : (t && t.seconds ? t.seconds * 1000 : (typeof t === 'number' ? t : 0));
function ago(ms){
  if(!ms) return '방금';
  const m = Math.floor((Date.now() - ms) / 60000);
  if(m < 1) return '방금'; if(m < 60) return m + '분 전'; const h = Math.floor(m / 60); if(h < 24) return h + '시간 전';
  const d = Math.floor(h / 24); return d < 7 ? d + '일 전' : new Date(ms + 9 * 3600e3).toISOString().slice(5, 10).replace('-', '.');
}
const ymd = (ms)=> ms ? new Date(ms + 9 * 3600e3).toISOString().slice(0, 10).replace(/-/g, '.') : '-';
const phoneFmt = (p)=>{ const d = String(p || '').replace(/^\+82/, '0').replace(/\D/g, ''); return d.length === 11 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : d || '-'; };

// ---------- 상태 ----------
const S = { members: [], help: [], voice: [], inq: [], goal: [], people: [], f: 'new', k: 'all', sel: null, mView: 'joined', mSort: 'joined', q: '' };
let api = null;     // { save(kind, id, patch) }

// ---------- 그리기 ----------
function todos(){
  const all = [
    ...S.help.map((x)=> ({ k: 'help', id: x.id, x, done: x.status === 'done', at: tsMs(x.createdAt) })),
    ...S.voice.map((x)=> ({ k: 'voice', id: x.id, x, done: x.status === 'answered' || !!x.reply, at: tsMs(x.createdAt) })),
    ...S.inq.map((x)=> ({ k: 'inq', id: x.id, x, done: x.status === 'done', at: tsMs(x.createdAt) })),
    ...S.goal.map((x)=> ({ k: 'goal', id: x.id, x, done: x.status === 'done', at: tsMs(x.createdAt) })),
  ];
  return all.sort((a, b)=> (b.at || 9e15) - (a.at || 9e15));
}
function itemText(t){
  const x = t.x;
  if(t.k === 'help'){ const pt = x.kind === 'pt';
    return { ic: ico(pt ? 'pt' : 'help'), t: (pt ? 'PT 상담 신청' : '1:1 운동가이드 신청') + ' · ' + esc(x.nickname || x.name || '회원'),
      d: esc((x.coach || '런관장 추천') + ' · ' + (x.times || []).join(', ') + (x.text ? ' · ' + x.text : '')) }; }
  if(t.k === 'voice') return { ic: ico('voice'), t: '런앤핏에 한마디' + (x.category ? ' · ' + esc(x.category) : '') + (x.nickname ? ' · ' + esc(x.nickname) : ''), d: esc(x.text || '') };
  if(t.k === 'goal') return { ic: ico('goal', '#E8F7EE'), t: '출석 목표 · ' + esc(x.nickname || x.name || '회원') + ' 주 ' + x.goal + '회', d: x.prev ? '주 ' + x.prev + '회 → 주 ' + x.goal + '회로 바꿨어요' : '처음으로 목표를 정했어요' };
  return { ic: ico('inq', '#FFF4CC'), t: '비회원 ' + esc(x.kind || '문의') + ' · ' + esc(x.name || ''), d: esc(phoneFmt(x.phone) + ' · 미니런앤핏에서 신청') };
}
function paintStats(){
  const total = S.members.length, joined = S.members.filter((m)=> m.uid || m.appJoinedAt).length;
  const today = KST(), todayJoin = S.members.filter((m)=> m.appJoinedAt && ymd(tsMs(m.appJoinedAt)).replace(/\./g, '-') === today).length;
  const att = S.members.filter((m)=> m.lastAttend === today).length, attApp = S.members.filter((m)=> m.lastAttend === today && (m.uid || m.appJoinedAt)).length;
  const now = S.people.filter((p)=> Date.now() - tsMs(p.ts) < 90e3), staffNow = now.filter((p)=> p.staff).length;
  const open = todos().filter((t)=> !t.done).length;
  const pct = total ? Math.round(joined / total * 100) : 0;
  $('stats').innerHTML =
    '<div class="stat"><div class="l">앱 가입 회원</div><div class="v" style="color:' + B + '">' + joined + '명</div><div class="s">유효 회원 ' + total + '명 중 ' + pct + '% · 오늘 +' + todayJoin + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="stat"><div class="l">오늘 출석</div><div class="v">' + att + '명</div><div class="s">그중 앱 가입 ' + attApp + '명</div></div>' +
    '<div class="stat"><div class="l">미니런앤핏에 지금</div><div class="v" style="color:' + B + '">' + now.length + '명</div><div class="s">회원 ' + (now.length - staffNow) + ' · 직원 ' + staffNow + '</div></div>' +
    '<div class="stat"><div class="l">처리 전 할 일</div><div class="v" style="color:' + (open ? '#B91C32' : '#15803D') + '">' + open + '개</div><div class="s">도움 요청 ' + S.help.filter((x)=> x.status !== 'done').length + ' · 한마디 ' + S.voice.filter((x)=> !(x.status === 'answered' || x.reply)).length + ' · 체험·상담 ' + S.inq.filter((x)=> x.status !== 'done').length + ' · 목표 ' + S.goal.filter((x)=> x.status !== 'done').length + '</div></div>' +
    '<div class="stat"><div class="l">이번 달 도움 요청</div><div class="v">' + S.help.filter((x)=> ymd(tsMs(x.createdAt)).slice(0, 7) === today.slice(0, 7).replace('-', '.')).length + '건</div><div class="s">운동가이드 ' + S.help.filter((x)=> x.kind !== 'pt').length + ' · PT 상담 ' + S.help.filter((x)=> x.kind === 'pt').length + ' (전체)</div></div>';
  const b = $('todoBadge'); b.textContent = open; b.classList.toggle('hidden', !open);
  document.title = (open ? '(' + open + ') ' : '') + '회원앱 관리 · 런앤핏';
  if(EMBED){ try{ window.parent.postMessage({ rfAdminOpen: open }, '*'); }catch(e){} }
}
function paintList(){
  const rows = todos().filter((t)=> (S.f === 'all' || (S.f === 'new' ? !t.done : t.done)) && (S.k === 'all' || S.k === t.k));
  if(S.sel && !rows.some((t)=> t.k + t.id === S.sel)) S.sel = null;
  if(!S.sel && rows.length) S.sel = rows[0].k + rows[0].id;
  $('items').innerHTML = rows.length ? rows.map((t)=>{ const it = itemText(t);
    return '<div class="item' + (S.sel === t.k + t.id ? ' on' : '') + '" data-sel="' + t.k + t.id + '">' + it.ic +
      '<div style="flex:1;min-width:0"><div class="t">' + it.t + '</div><div class="d">' + it.d + '</div></div>' +

  showShell('예시 직원'); $('demoTag').classList.remove('hidden'); $('logout').onclick = ()=> location.href = EMBED ? './?embed' : './';
  paint();
} else {
  // ---------- 실제 연결 ----------
  const app = initializeApp({ apiKey: 'AIzaSyBbE0ktG6f5t-1xvVEg56f18DE_QdtIrts', authDomain: 'runnfit-member.firebaseapp.com', projectId: 'runnfit-member', storageBucket: 'runnfit-member.firebasestorage.app', messagingSenderId: '1029886465637', appId: '1:1029886465637:web:36ac86705e3504f6c0588c' });
  const auth = getAuth(app), db = getFirestore(app);
  const COL = { help: 'help_requests', voice: 'voices', inq: 'inquiries' };
  let unsubs = [];
  $('loginForm').onsubmit = async (e)=>{ e.preventDefault(); const m = $('loginMsg'); m.textContent = ''; $('loginBtn').disabled = true;
    try{ await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); }
    catch(err){ m.textContent = /invalid|wrong|not-found|credential/i.test(err.code || '') ? '이메일 또는 비밀번호가 맞지 않아요.' : /too-many/.test(err.code || '') ? '시도가 너무 많아요. 잠시 후 다시 해주세요.' : '들어가지 못했어요. (' + (err.code || err.message) + ')'; }
    $('loginBtn').disabled = false; };
  $('logout').onclick = ()=> signOut(auth);
  onAuthStateChanged(auth, async (u)=>{
    unsubs.forEach((f)=> f()); unsubs = [];
    if(!u || !u.email){ $('shell').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
    let role = null;
    try{ const s = await getDoc(doc(db, 'staff', u.uid)); role = s.exists() ? (s.data().role || 'staff') : null; }catch(e){}
    if(!role){ $('loginMsg').textContent = '이 계정은 회원앱 직원으로 등록되어 있지 않아요.'; await signOut(auth); return; }
    const who = (u.email || '').split('@')[0];
    api = { who, save: (kind, id, patch)=> updateDoc(doc(db, COL[kind], id), patch) };
    showShell(who + (role === 'owner' ? ' (대표)' : ''));
    paint();
    const listen = (key, q)=> unsubs.push(onSnapshot(q, (s)=>{ S[key] = s.docs.map((d)=> ({ id: d.id, ...d.data() })); paint(); }, (e)=> console.warn(key, e)));
    listen('help', query(collection(db, 'help_requests'), orderBy('createdAt', 'desc'), limit(200)));
    listen('voice', query(collection(db, 'voices'), orderBy('createdAt', 'desc'), limit(200)));
    listen('inq', query(collection(db, 'inquiries'), orderBy('createdAt', 'desc'), limit(200)));
    listen('goal', query(collection(db, 'goal_logs'), orderBy('createdAt', 'desc'), limit(200)));
    listen('people', collection(db, 'gym_people'));
    const loadMembers = async ()=>{ try{ const s = await getDocs(collection(db, 'members')); S.members = s.docs.map((d)=> ({ id: d.id, ...d.data() })); paint(); }catch(e){ console.warn('members', e); } };
    loadMembers(); const t = setInterval(loadMembers, 5 * 60e3); unsubs.push(()=> clearInterval(t));
  });
}
</script>
