<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런앤핏 정릉점 · 마케팅 KPI</title>
<style>
  :root{ --navy:#18338c; --ink:#16213d; --muted:#5d6782; --faint:#9aa1b2; --line:#dfe4ee; --bg:#f3f5f9; --card:#fff;
    --c1:#3b5bd6; --c2:#d9782a; --grid:#eef1f6; --good:#0a7d3c; --bad:#b4232f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font:15px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; display:flex; flex-direction:column; }
  .topbar{ background:var(--navy); color:#fff; height:60px; flex:none; display:flex; align-items:center; gap:22px; padding:0 22px; }
  .topbar .logo{ height:26px; width:auto; display:block; }
  .topbar .where{ font-size:17px; font-weight:700; display:flex; align-items:center; line-height:1; white-space:nowrap; }
  .topbar .where .bar{ opacity:.55; margin:0 4px; font-weight:400; }
  .topbar .tabs{ display:flex; gap:4px; background:rgba(255,255,255,.1); border-radius:12px; padding:4px; }
  .topbar .tab{ font:inherit; font-size:14px; font-weight:800; color:rgba(255,255,255,.75); background:none; border:0; border-radius:9px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
  .topbar .tab.on{ background:#fff; color:var(--navy); cursor:default; }
  main[hidden]{ display:none; }
  .topbar .tab.on:hover{ background:#fff; color:var(--navy); }
  .topbar button.tab:hover{ background:rgba(255,255,255,.18); color:#fff; }
  .topbar .close{ margin-left:auto; font:inherit; font-size:14px; font-weight:700; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:10px; padding:6px 12px; cursor:pointer; }
  .sub{ display:flex; align-items:center; gap:10px; padding:12px 22px 0; font-size:13px; color:var(--muted); }
  .sub b{ color:var(--ink); }
  .sub .link{ font:inherit; font-size:12.5px; font-weight:700; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; }
  main{ flex:1; min-height:0; overflow:auto; padding:12px 22px 22px; }
  .grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; min-width:0; }
  .span2{ grid-column:span 2; } .span4{ grid-column:1 / -1; }
  .lbl{ font-size:13px; font-weight:700; color:var(--muted); }
  .big{ font-size:30px; font-weight:800; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; }
  .big small{ font-size:15px; font-weight:700; color:var(--muted); margin-left:2px; }
  .note{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .note b{ color:var(--ink); }
  .split{ display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:10px; gap:2px; background:var(--grid); }
  .split i{ display:block; height:100%; }
  .keys{ display:flex; gap:12px; font-size:12px; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
  .keys span::before{ content:''; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--k); }
  h2{ margin:0 0 10px; font-size:16px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h2 small{ font-size:12.5px; font-weight:600; color:var(--muted); }
  /* 퍼널 */
  .funnel{ display:flex; flex-direction:column; gap:10px; }
  .fr{ display:grid; grid-template-columns:62px minmax(40px,1fr) 40px; align-items:center; gap:8px; }
  .fr .n{ font-weight:700; color:var(--muted); font-size:13px; }
  .fr .b{ display:block; height:26px; background:var(--grid); border-radius:6px; position:relative; }
  .fr .b i{ position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--c1); }
  .fr .v{ text-align:right; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }
  .conv{ margin:-4px 0 -4px 70px; font-size:12px; font-weight:700; color:var(--muted); }
  .conv b{ color:var(--navy); font-size:13px; }
  /* 막대 그래프 */
  .chart{ position:relative; height:170px; display:flex; align-items:stretch; gap:3px; padding:0 0 20px; border-bottom:1px solid var(--line); }
  .chart.tall{ height:200px; }
  .col{ flex:1; position:relative; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; min-width:0; cursor:default; }
  .col .bar{ width:70%; max-width:22px; display:flex; flex-direction:column-reverse; gap:2px; }
  .col .bar i{ display:block; width:100%; border-radius:4px 4px 0 0; }
  .col .bar i + i{ border-radius:4px 4px 0 0; }
  .col .bar i.neg{ background:#c3c8d4 !important; }
  .col .d{ position:absolute; bottom:-18px; font-size:10.5px; color:var(--faint); white-space:nowrap; }
  .col.we .d{ color:#c2410c; }
  .col.future .bar{ opacity:0; }
  .col.today .d{ color:var(--navy); font-weight:800; }
  .col .lab{ font-size:10px; font-weight:700; color:var(--muted); margin-bottom:2px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .col:hover{ background:#f5f7fc; border-radius:6px; }
  .tip{ position:fixed; z-index:99; pointer-events:none; background:#16213d; color:#fff; font-size:12.5px; line-height:1.5; border-radius:8px; padding:7px 10px; box-shadow:0 6px 18px rgba(0,0,0,.2); display:none; white-space:nowrap; }
  .tip b{ font-weight:800; }
  /* 홍보 */
  .chips{ display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:8px; }
  .chip{ background:#f7f8fb; border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  .chip .lbl{ font-size:12px; }
  .chip .big{ font-size:22px; }
  .setup{ max-width:620px; margin:40px auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 28px; }
  .setup h3{ margin:0 0 6px; font-size:20px; }
  .setup ol{ margin:10px 0 16px; padding-left:20px; color:var(--muted); line-height:1.8; }
  .setup input{ width:100%; font:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  .setup button{ margin-top:10px; font:inherit; font-weight:800; color:#fff; background:var(--navy); border:0; border-radius:10px; padding:10px 18px; cursor:pointer; }
  .setup .err{ color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; }
  .msg{ text-align:center; color:var(--muted); padding:60px 0; }
  /* ===== 경영계기판 ===== */
  :root{ --g:#2fb36b; --gbg:#e3f5ea; --y:#f5b82e; --ybg:#fdf3d8; --r:#e5484d; --rbg:#fde8e8; }
  .bwrap{ display:grid; gap:14px; }
  .dash4{ display:grid; grid-template-columns:1.25fr 1fr 1fr 1fr; gap:14px; }
  .hero .big{ font-size:40px; font-weight:900; } .hero .big small{ font-size:18px; }
  .pbar{ position:relative; height:14px; background:#eef1f6; border-radius:7px; margin:26px 18px 30px 0; }
  .pbar i{ position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--c1); }
  .pbar .tick{ position:absolute; top:-4px; bottom:-4px; border-left:2px dashed #b9c0cf; }
  .pbar .tick span{ position:absolute; top:20px; left:0; transform:translateX(-50%); white-space:nowrap; font-size:11px; color:var(--muted); font-weight:700; }
  .pbar .tick.basic{ border-color:var(--ink); } .pbar .tick.basic span{ color:var(--ink); top:-20px; }
  .pace{ display:flex; gap:8px; flex-wrap:wrap; }
  .pchip{ font-size:12.5px; font-weight:700; border-radius:999px; padding:4px 10px; background:#f1f3f8; color:var(--muted); }
  .pchip.g{ background:var(--gbg); color:#0a6b35; } .pchip.y{ background:var(--ybg); color:#8a5a00; } .pchip.r{ background:var(--rbg); color:#a3232a; }
  .remain .big{ font-size:34px; font-weight:900; }
  .rally{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .rally div{ border-radius:10px; padding:8px 10px; text-align:center; } .rally b{ display:block; font-size:22px; font-weight:900; } .rally span{ font-size:11.5px; font-weight:700; }
  .rally .g{ background:var(--gbg); color:#0a6b35; } .rally .y{ background:var(--ybg); color:#8a5a00; } .rally .r{ background:var(--rbg); color:#a3232a; }
  .gb .top{ display:flex; align-items:baseline; justify-content:space-between; margin-top:6px; }
  .gb .amt{ font-size:32px; font-weight:900; font-variant-numeric:tabular-nums; } .gb .amt small{ font-size:15px; color:var(--muted); font-weight:800; }
  .gb .pct{ font-size:32px; font-weight:900; color:var(--k); }
  .gb .sub2{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); } .gb .sub2 b{ color:var(--ink); }
  .gbar{ position:relative; height:14px; background:#eef1f6; border-radius:7px; margin:12px 0 4px; }
  .gbar i{ position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--k); }
  .gbar .exp{ position:absolute; top:-5px; bottom:-5px; border-left:2px dashed var(--ink); }
  .gl{ position:relative; height:16px; margin-top:8px; font-size:11px; font-weight:700; } .gl span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .stline{ display:inline-block; font-size:12.5px; font-weight:700; border-radius:8px; padding:4px 9px; margin-top:6px; }
  .stline.g{ background:var(--gbg); color:#0a6b35; } .stline.y{ background:var(--ybg); color:#8a5a00; } .stline.r{ background:var(--rbg); color:#a3232a; }
  .legend3{ display:flex; gap:12px; font-size:12px; color:var(--muted); font-weight:600; }
  .legend3 span::before{ content:''; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; background:var(--k); }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr) 1.1fr; gap:6px; }
  .hd{ font-size:13px; font-weight:800; text-align:center; color:var(--muted); padding-bottom:4px; border-bottom:2px solid #c9cfdb; }
  .hd.sat{ color:#2850c8; border-color:#7d97e6; } .hd.sun{ color:#d23a3a; border-color:#ef9a9a; } .hd.wk{ background:#e6ecf8; border-radius:8px 8px 0 0; color:var(--navy); }
  .cell{ border-radius:10px; padding:7px 9px; min-height:96px; background:#fff; border:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .cell.empty{ background:transparent; border:0; }
  .cell .d{ font-size:13px; font-weight:800; display:flex; justify-content:space-between; }
  .cell .d em{ font-style:normal; font-size:11px; font-weight:800; border-radius:6px; padding:0 5px; }
  .cell.sat .d>span{ color:#2850c8; } .cell.sun .d>span{ color:#d23a3a; }
  .cell .row{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:3px; }
  .cell .row b{ color:var(--ink); font-weight:600; } .cell .row.neg b{ color:#a3232a; }
  .cell .tot{ display:flex; justify-content:space-between; font-size:14px; font-weight:900; margin-top:4px; padding-top:4px; border-top:1px solid rgba(0,0,0,.06); }
  .cell.g{ background:var(--gbg); border-color:#bfe6cd; } .cell.g .d em{ background:var(--g); color:#fff; }
  .cell.y{ background:var(--ybg); border-color:#f3dea0; } .cell.y .d em{ background:var(--y); color:#5a3b00; }
  .cell.r{ background:var(--rbg); border-color:#f4c4c6; } .cell.r .d em{ background:var(--r); color:#fff; }
  .cell.today{ outline:3px solid var(--navy); outline-offset:-1px; }
  .cell.future{ background:#fafbfd; color:var(--faint); } .cell.future .goal{ font-size:11.5px; color:var(--faint); margin-top:6px; }
  .wkc{ background:#eef2fb; border-color:#d6def3; } .wkc .d{ color:var(--navy); }
  .bfoot{ font-size:12px; color:var(--muted); margin-top:10px; }
  .rallygrid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; }
  .rallygrid .lc{ display:flex; flex-direction:column; justify-content:space-between; } .cum{ width:100%; height:auto; display:block; }
  .cum .ax{ font-size:12px; fill:#9aa1b2; } .cum .ax.td{ fill:#18338c; font-weight:800; }
  .cum .pln{ stroke:#c3c8d4; } .cum .pln.on{ stroke:#16213d; stroke-width:2.5; }
  .cum .ln{ font-size:12px; fill:#9aa1b2; font-weight:700; } .cum .ln.on{ fill:#16213d; font-weight:900; } .cum .now{ font-size:14px; fill:#16213d; font-weight:900; }
  .dtkey{ display:flex; gap:14px; font-size:12px; color:var(--muted); margin:2px 0 8px; font-weight:600; align-items:center; flex-wrap:wrap; }
  .dtkey i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-2px; }
  .selbox{ font-weight:800; color:var(--ink); display:inline-flex; align-items:center; gap:6px; margin-right:8px; }
  .selbox select{ font:inherit; font-weight:800; font-size:14px; color:#fff; background:var(--ink); border:0; border-radius:8px; padding:5px 10px; cursor:pointer; }
  .tbwrap{ border:1px solid var(--line); border-radius:10px; }
  .dt{ width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .dt th{ white-space:nowrap; background:#f5f7fb; color:var(--muted); font-weight:800; padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); }
  .dt th:first-child, .dt td:first-child{ text-align:left; }
  .dt td{ white-space:nowrap; padding:3px 8px; text-align:right; border-bottom:1px solid #f1f3f8; }
  .dt td.we{ color:#c2410c; } .dt td.neg{ color:#a3232a; }
  .dt tfoot td{ background:#f5f7fb; font-weight:800; }
  .dt th.pl, .dt td.pl{ background:#f1f4fb; color:var(--ink); font-weight:800; }
  .dt td.pl.hit{ background:var(--gbg); color:#0a6b35; } .dt td.pl.hit::before{ content:'✓ '; }
  .dt td.pl.mid{ background:var(--ybg); color:#8a5a00; } .dt td.pl.miss{ background:var(--rbg); color:#a3232a; }
  .dt td.up{ color:#0a6b35; font-weight:700; } .dt td.dn{ color:#a3232a; font-weight:700; }
  .dt tr.fut td:first-child{ color:#b0b6c3; }
  .dt tr.today td{ border-top:2px solid var(--navy); border-bottom:2px solid var(--navy); background:#eef2fb; } .dt tr.today td:first-child{ color:var(--navy); font-weight:900; }
  .pill{ display:inline-block; min-width:52px; text-align:center; border-radius:6px; padding:1px 6px; font-weight:800; font-size:11.5px; }
  .pill.g{ background:var(--gbg); color:#0a6b35; } .pill.y{ background:var(--ybg); color:#8a5a00; } .pill.r{ background:var(--rbg); color:#a3232a; }
</style>
</head>

  <div class="sub" id="sub" hidden></div>
  <main id="setupMain" hidden></main>
  <main id="boardMain"><div class="msg">불러오는 중…</div></main>
  <main id="kpiMain" hidden><div class="msg">불러오는 중…</div></main>
  <div class="tip" id="tip" role="tooltip"></div>
<script>
(function(){
  const $ = (id)=> document.getElementById(id);
  const top = window.parent || window;
  $('rfClose').addEventListener('click', ()=>{ try{ top.close(); }catch(e){} try{ window.frameElement && window.frameElement.remove(); }catch(e){} });
  $('toAttend').addEventListener('click', ()=>{ try{ if(top.opener && !top.opener.closed){ top.opener.focus(); return; } }catch(e){} alert('출석 화면 창으로 돌아가 주세요.'); });

  const KST = 9 * 3600e3;
  const today = new Date(Date.now() + KST).toISOString().slice(0, 10);
  const month = today.slice(0, 7), mNum = +today.slice(5, 7), dNum = +today.slice(8, 10);
  const KEY = 'runfit_kpi_sheet_' + month;
  const KPI_GID = '1416723171';   // '마케팅 KPI' 탭 (파일을 복사해도 같은 번호가 유지됨)
  const store = { get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }, set(v){ try{ localStorage.setItem(KEY, v); }catch(e){} }, del(){ try{ localStorage.removeItem(KEY); }catch(e){} } };
  const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, (c)=> ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmt = (n)=> n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
  const won = (n)=> n == null || isNaN(n) ? '-' : Math.abs(n) >= 10000 ? (n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '만' : fmt(n);
  const pct = (a, b)=> b ? Math.round(a * 100 / b) + '%' : '-';

  function parseCsv(s){
    const rows = []; let r = [], f = '', q = false;
    for(let i = 0; i < s.length; i++){ const c = s[i];
      if(q){ if(c === '"' && s[i + 1] === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
      else if(c === '"') q = true; else if(c === ','){ r.push(f); f = ''; } else if(c === '\n'){ r.push(f); rows.push(r); r = []; f = ''; } else if(c !== '\r') f += c; }
    r.push(f); rows.push(r); return rows;
  }
  const norm = (s)=> String(s || '').replace(/\s+/g, '');
  const num = (s)=> { const t = String(s || '').replace(/[,원%\s]/g, ''); if(t === '' || isNaN(+t)) return null; return +t; };
  // 시트 제목 → 대시보드 항목
  const FIELDS = { '유효회원':'valid', '일방문객':'visit', '만료예정':'expire', '7일이상미출석':'absent', '미출석연락':'called',
    '신규문의':'inq', '신규방문':'tour', '신규등록':'join', '재등록':'rereg', '소개':'refer',
    '회원권매출':'salesM', 'PT매출':'salesP', '일':'salesD', '누적':'salesCum',
    '쿠폰':'coupon', '전단(우편)':'flyer', '전단':'flyer', '벽보':'poster', '현수막':'banner',
    '플레이스방문':'place', '네이버리뷰':'review', '인스타':'insta', '블로그':'blog', '당근':'karrot' };

  function extract(rows){
    const h = rows.findIndex((r)=> r.some((c)=> norm(c) === '유효회원') && r.some((c)=> norm(c) === '신규문의'));
    if(h < 0) return null;
    const col = {}; rows[h].forEach((c, i)=>{ const k = FIELDS[norm(c)]; if(k && col[k] == null) col[k] = i; });
    const dayCol = rows[h].findIndex((c)=> /^\d+월?$/.test(norm(c))) + 1 || 2;   // '9 월' 옆 칸이 날짜
    const total = {}; Object.keys(col).forEach((k)=> total[k] = num(rows[h + 1][col[k]]));
    const days = [];
    for(let r = h + 2; r < rows.length; r++){
      const d = num(rows[r][dayCol]); if(d == null || d < 1 || d > 31){ if(days.length) break; else continue; }
      const o = { d, wd: rows[r][dayCol - 1] || '' }; Object.keys(col).forEach((k)=> o[k] = num(rows[r][col[k]]));
      days.push(o);
    }
    return { total, days };
  }
  async function loadSheet(url){
    const id = (url.match(/\/d\/([\w-]{20,})/) || [])[1]; if(!id) throw new Error('주소에서 시트를 찾지 못했어요.');
    const g = (url.match(/gid=(\d+)/) || [])[1];
    for(const gid of [...new Set([g, KPI_GID].filter(Boolean))]){
      try{
        const r = await fetch('https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv&gid=' + gid, { cache: 'no-store' });
        if(!r.ok) continue;
        const data = extract(parseCsv(await r.text()));
        if(data && data.days.length) return data;
      }catch(e){}
    }
    throw new Error("'마케팅 KPI' 탭을 찾지 못했어요. 시트 공유가 '링크가 있는 모든 사용자'인지, 그 탭에서 주소를 복사했는지 확인해 주세요.");
  }

  function setupView(err){
    $('sub').hidden = true; setupMode = true; show(VIEW);
    $('setupMain').innerHTML = '<div class="setup"><h3>' + mNum + '월 시트 연결하기</h3>' +
      '<div class="note">매달 새 시트를 만들면 여기서 한 번만 연결하면 돼요. 주소는 이 컴퓨터에만 저장돼요.</div>' +
      '<ol><li>이번 달 시트에서 <b>마케팅 KPI</b> 탭을 열어요.</li><li>주소창의 주소를 복사해요.</li><li>아래에 붙여넣고 연결을 눌러요.</li></ol>' +
      '<input id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off"><button id="sheetGo" type="button">연결</button><div class="err" id="sheetErr">' + esc(err || '') + '</div></div>';
    const go = async ()=>{ const v = $('sheetUrl').value.trim(); if(!v) return; $('sheetErr').textContent = '확인 중…';
      try{ await loadSheet(v); store.set(v); start(); }catch(e){ $('sheetErr').textContent = e.message; } };
    $('sheetGo').addEventListener('click', go);
    $('sheetUrl').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') go(); });
  }

  // ---------- 그리기 ----------
  const tip = $('tip');
  document.addEventListener('mousemove', (e)=>{ const c = e.target.closest && e.target.closest('[data-tip]');
    if(!c){ tip.style.display = 'none'; return; }
    tip.innerHTML = c.getAttribute('data-tip'); tip.style.display = 'block';
    const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });

  function bars(days, last, parts, opt){
    opt = opt || {};
    const tot = (o)=> parts.reduce((s, p)=> s + Math.max(0, o[p.k] || 0), 0);
    const max = Math.max(1, ...days.map(tot));
    return '<div class="chart' + (opt.tall ? ' tall' : '') + '">' + days.map((o)=>{
      const fut = o.d > last, t = tot(o);
      const segs = parts.map((p)=>{ const v = o[p.k] || 0; if(v <= 0) return ''; return '<i style="height:' + (v / max * (opt.tall ? 150 : 120)).toFixed(1) + 'px;background:' + p.c + '"></i>'; }).join('');
      const neg = parts.some((p)=> (o[p.k] || 0) < 0);
      const tipTxt = '<b>' + mNum + '.' + o.d + ' (' + esc(o.wd) + ')</b><br>' + parts.map((p)=> p.n + ' <b>' + (opt.money ? fmt(o[p.k] || 0) + '원' : fmt(o[p.k] || 0)) + '</b>').join('<br>') + (opt.extra ? opt.extra(o) : '');
      const showLab = !fut && t > 0 && (opt.labelAll || t === max);
      return '<div class="col' + (fut ? ' future' : '') + (o.d === dNum ? ' today' : '') + (/[토일]/.test(o.wd) ? ' we' : '') + '"' + (fut ? '' : ' data-tip="' + esc(tipTxt) + '"') + '>' +
        (showLab ? '<span class="lab">' + (opt.money ? won(o.salesD != null ? o.salesD : t) + (neg ? ' ↩︎' : '') : fmt(t)) + '</span>' : '') +
        '<span class="bar">' + segs + (neg ? '<i class="neg" style="height:3px"></i>' : '') + '</span>' +
        '<span class="d">' + (o.d === 1 || o.d % 5 === 0 || o.d === dNum ? o.d : '') + '</span></div>';
    }).join('') + '</div>';
  }

  function draw(data){
    const T = data.total, D = data.days;
    const last = Math.max(0, ...D.filter((o)=> o.valid != null || (o.salesD || 0) !== 0 || (o.inq || 0) > 0).map((o)=> o.d));
    const L = D.find((o)=> o.d === last) || {};
    const sum = (k)=> D.filter((o)=> o.d <= last).reduce((s, o)=> s + (o[k] || 0), 0);
    const pick = (k)=> T[k] != null ? T[k] : sum(k);
    const inq = pick('inq'), tour = pick('tour'), join = pick('join'), rereg = pick('rereg'), refer = pick('refer'), expire = pick('expire');
    const sM = pick('salesM'), sP = pick('salesP'), sCum = T.salesCum != null ? T.salesCum : (L.salesCum != null ? L.salesCum : sM + sP);
    const reviewGain = T.review != null ? T.review : null;
    const lastReview = (D.filter((o)=> o.review != null && o.d <= last).pop() || {}).review;   // 리뷰는 누적 숫자라 마지막으로 적힌 값
    const mx = Math.max(inq, 1);


    $('kpiMain').innerHTML = '<div class="grid">' +
      // 1줄: 숫자
      '<div class="card"><div class="lbl">💰 이번 달 매출</div><div class="big">' + won(sCum) + '<small>원</small></div>' +
        '<div class="split" aria-hidden="true"><i style="flex:' + Math.max(0, sM) + ';background:var(--c1)"></i><i style="flex:' + Math.max(0, sP) + ';background:var(--c2)"></i></div>' +

  // ================= 화면 전환 (경영계기판 / 마케팅 KPI) =================
  const TITLES = { board: mNum + '월 경영계기판', kpi: '마케팅 KPI 대시보드' };
  let VIEW = (function(){ try{ return top.__RF_VIEW === 'kpi' ? 'kpi' : 'board'; }catch(e){ return 'board'; } })();
  let setupMode = false;

  // ================= 경영계기판: 시트 '매출' 탭 =================
  const SALES_GID = '486303784';   // '매출' 탭 (파일을 복사해도 같은 번호가 유지됨)
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const DAYS = new Date(Date.UTC(+today.slice(0, 4), mNum, 0)).getUTCDate();
  const FIRST_DOW = new Date(Date.UTC(+today.slice(0, 4), mNum - 1, 1)).getUTCDay();
  const wdOf = (d)=> WD[(FIRST_DOW + d - 1) % 7];
  const isWe = (d)=> /[토일]/.test(wdOf(d));
  const man = (n)=> n == null || isNaN(n) ? '-' : (n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '만';

  function extractSales(rows){
    const cell = (r, c)=> (rows[r] || [])[c];
    // 목표: 라벨 오른쪽(없으면 아래) 첫 숫자
    const findVal = (label)=>{
      for(let r = 0; r < Math.min(rows.length, 40); r++) for(let c = 0; c < rows[r].length; c++){
        if(norm(rows[r][c]) !== label) continue;
        for(let k = 1; k <= 3; k++){ const v = num(cell(r, c + k)); if(v != null && v > 0) return v; }
        const b = num(cell(r + 1, c)); if(b != null && b > 0) return b;
      }
      return null;
    };
    const G = { month: findVal('월목표') || findVal('총'), wd: findVal('평일목표'), we: findVal('주말목표'), mem: findVal('회원권'), pt: findVal('PT권') || findVal('PT') };
    const h = rows.findIndex((r)=> r.some((c)=> norm(c) === '회원권매출') && r.some((c)=> norm(c) === '누적매출'));
    if(h < 0) return null;
    const H = rows[h].map(norm);
    const ci = (n)=> H.indexOf(n);
    const cD = ci('일'), cM = ci('회원권매출'), cP = ci('PT매출'), cT = ci('일매출');
    // BEST/BASIC/BEP: 제목 줄 위 칸에 숫자가 있는 열
    ['BEST', 'BASIC', 'BEP'].forEach((n)=>{ H.forEach((x, i)=>{ if(x === n){ const v = num(cell(h - 1, i)); if(v != null && v > 0) G[n.toLowerCase()] = v; } }); });
    if(!G.basic) G.basic = G.month;
    const data = {};
    for(let r = h + 1; r < rows.length; r++){
      const d = num(cell(r, cD)); if(d == null || d < 1 || d > 31){ if(Object.keys(data).length) break; continue; }
      if(data[d]) break;   // 표 아래 다른 영역은 읽지 않음
      data[d] = { m: num(cell(r, cM)) || 0, p: num(cell(r, cP)) || 0 };
      data[d].t = cT >= 0 && num(cell(r, cT)) != null ? num(cell(r, cT)) : data[d].m + data[d].p;
    }
    if(!G.month || !Object.keys(data).length) return null;
    // 평일·주말 목표가 없으면 시트와 같은 방식으로 계산
    let weN = 0; for(let d = 1; d <= DAYS; d++) if(isWe(d)) weN++;
    if(!G.we) G.we = 1000000;
    if(!G.wd) G.wd = (G.month - weN * G.we) / (DAYS - weN);
    return { G, data };
  }
  async function loadSales(url){
    const id = (url.match(/\/d\/([\w-]{20,})/) || [])[1]; if(!id) throw new Error('주소에서 시트를 찾지 못했어요.');
    const r = await fetch('https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv&gid=' + SALES_GID, { cache: 'no-store' });
    if(!r.ok) throw new Error("시트에서 '매출' 탭을 찾지 못했어요.");
    const s = extractSales(parseCsv(await r.text()));
    if(!s) throw new Error("'매출' 탭에서 목표나 일별 매출을 찾지 못했어요.");
    return s;
  }

  let SEL = 'basic';
  function drawBoard(S){
    const G = S.G, data = S.data, NAME = { best: 'BEST', basic: 'BASIC', bep: 'BEP' };
    const dNow = dNum;
    const isPast = (d)=> d < dNow || (d === dNow && data[d] && (data[d].m || data[d].p));
    const goalOf = (d)=> isWe(d) ? G.we : G.wd;
    const cls = (r)=> r >= 1 ? 'g' : r >= .6 ? 'y' : 'r';
    let cum = 0, sm = 0, sp = 0, plan = 0, last = 0;
    for(let d = 1; d <= DAYS; d++){ if(!isPast(d)) continue; const x = data[d] || { m: 0, p: 0, t: 0 }; cum += x.t; sm += x.m; sp += x.p; plan += goalOf(d); last = d; }
    let rg = 0, ry = 0, rr = 0; for(let d = 1; d <= last; d++){ const c = cls(((data[d] || {}).t || 0) / goalOf(d)); c === 'g' ? rg++ : c === 'y' ? ry++ : rr++; }
    const left = G.month - cum, daysLeft = Math.max(1, DAYS - last), expShare = plan / G.month;
    const top3 = Math.max(G.best || 0, G.month);
    // 계획 누적 (주말은 하루 주말목표, 나머지는 평일에 나눔 · 시트와 같은 방식)
    let weN = 0; for(let d = 1; d <= DAYS; d++) if(isWe(d)) weN++;
    const planCum = (goal)=>{ const wdg = (goal - weN * G.we) / (DAYS - weN); let c = 0; const a = []; for(let d = 1; d <= DAYS; d++){ c += isWe(d) ? G.we : wdg; a.push(c); } return a; };
    const P = {}; ['best', 'basic', 'bep'].forEach((k)=>{ if(G[k]) P[k] = planCum(G[k]); });
    if(!P[SEL]) SEL = 'basic';

    let h = '<div class="bwrap"><div class="dash4">';
    // 1) 월 매출
    const paceR = plan ? cum / plan : 1;

      '<div class="pbar"><i style="width:' + Math.min(100, cum / top3 * 100) + '%"></i>' +
      [['bep', 'BEP'], ['basic', 'BASIC'], ['best', 'BEST']].filter((t)=> G[t[0]]).map((t)=> '<span class="tick ' + t[0] + '" style="left:' + (G[t[0]] / top3 * 100) + '%"><span>' + t[1] + '</span></span>').join('') + '</div>' +
      '<div class="note" style="margin:-14px 0 10px;font-size:12px">' + [['BEP', 'bep'], ['BASIC', 'basic'], ['BEST', 'best']].filter((t)=> G[t[1]]).map((t)=> t[0] + ' <b>' + man(G[t[1]]) + '</b>').join(' · ') + '</div>' +
      '<div class="pace"><span class="pchip ' + cls(paceR) + '">오늘까지 계획 대비 ' + (paceR * 100).toFixed(1) + '%</span><span class="pchip">계획 ' + man(plan) + ' · 실제 ' + man(cum) + '</span></div></div>';
    // 2) 남은 금액
    h += '<div class="card remain"><div class="lbl">목표까지 남은 금액</div><div class="big">' + fmt(Math.max(0, left)) + '<small style="font-size:15px;color:var(--muted)">원</small></div>' +
      '<div class="note">남은 <b>' + daysLeft + '일</b> 동안 하루 평균 <b>' + man(Math.max(0, left) / daysLeft) + '</b> 필요</div>' +
      '<div class="rally"><div class="g"><b>' + rg + '일</b><span>100% 이상</span></div><div class="y"><b>' + ry + '일</b><span>60~99%</span></div><div class="r"><b>' + rr + '일</b><span>60% 미만</span></div></div>' +
      '<div class="note" style="font-size:11.5px">일 목표: 평일 ' + man(G.wd) + ' · 주말 ' + man(G.we) + '</div></div>';
    // 3·4) 회원권 / PT
    [['회원권', sm, G.mem, 'var(--c1)'], ['PT', sp, G.pt, 'var(--c2)']].forEach((x)=>{
      if(!x[2]){ h += '<div class="card gb"><div class="lbl">' + x[0] + '</div><div class="top"><span class="amt">' + man(x[1]) + '</span></div><div class="note">시트에 ' + x[0] + ' 목표가 없어요</div></div>'; return; }
      const p = x[1] / x[2], pace = expShare ? p / expShare : 1, st = pace >= 1 ? 'g' : pace >= .8 ? 'y' : 'r';
      h += '<div class="card gb" style="--k:' + x[3] + '"><div class="lbl">' + x[0] + '</div><div class="top"><span class="amt">' + (x[1] / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '<small>만</small></span><span class="pct">' + Math.round(p * 100) + '%</span></div>' +
        '<div class="sub2"><span>목표 <b>' + man(x[2]) + '</b></span><span>남은 <b>' + man(x[2] - x[1]) + '</b></span></div>' +
        '<div class="gbar"><i style="width:' + Math.min(100, Math.max(0, p * 100)) + '%"></i><span class="exp" style="left:' + Math.min(100, expShare * 100) + '%"></span></div><div class="gl"><span style="left:' + Math.min(100, expShare * 100) + '%">오늘 목표선 ' + Math.round(expShare * 100) + '%</span></div>' +
        '<span class="stline ' + st + '">' + (st === 'g' ? '계획보다 앞서요' : st === 'y' ? '계획보다 조금 늦어요' : '계획보다 많이 늦어요') + '</span><div class="note">하루 <b>' + man(Math.max(0, x[2] - x[1]) / daysLeft) + '</b> 필요</div></div>';
    });
    h += '</div>';

    // 달력
    h += '<div class="card"><h2>' + mNum + '월 매출 달력 <small>칸 색 = 그날 일 목표 달성 (평일 ' + man(G.wd) + ' · 주말 ' + man(G.we) + ')</small><span class="legend3"><span style="--k:var(--g)">100% 이상</span><span style="--k:var(--y)">60~99%</span><span style="--k:var(--r)">60% 미만</span></span></h2><div class="cal">';
    ['월', '화', '수', '목', '금', '토', '일'].forEach((w)=> h += '<div class="hd ' + (w === '토' ? 'sat' : w === '일' ? 'sun' : '') + '">' + w + '</div>'); h += '<div class="hd wk">주간</div>';
    const cells = []; for(let i = 0; i < (FIRST_DOW + 6) % 7; i++) cells.push(null); for(let d = 1; d <= DAYS; d++) cells.push(d); while(cells.length % 7) cells.push(null);
    for(let w = 0; w < cells.length / 7; w++){
      let wm = 0, wp = 0, wg = 0, wgPast = 0, has = false;
      for(let k = 0; k < 7; k++){
        const d = cells[w * 7 + k]; if(!d){ h += '<div class="cell empty"></div>'; continue; }
        const sat = wdOf(d) === '토', sun = wdOf(d) === '일'; wg += goalOf(d);
        if(isPast(d)){
          const x = data[d] || { m: 0, p: 0, t: 0 }; wm += x.m; wp += x.p; wgPast += goalOf(d); has = true; const r = x.t / goalOf(d);
          h += '<div class="cell ' + cls(r) + (sat ? ' sat' : sun ? ' sun' : '') + (d === dNow ? ' today' : '') + '"><div class="d"><span>' + d + '</span><em>' + Math.round(r * 100) + '%</em></div>' +
            '<div class="row"><span>회원권</span><b>' + fmt(x.m) + '</b></div><div class="row' + (x.p < 0 ? ' neg' : '') + '"><span>PT</span><b>' + fmt(x.p) + (x.p < 0 ? ' ↩︎' : '') + '</b></div>' +
            '<div class="tot"><span>합계</span><span>' + fmt(x.t) + '</span></div></div>';
        } else {
          h += '<div class="cell future' + (d === dNow ? ' today' : '') + (sat ? ' sat' : sun ? ' sun' : '') + '"><div class="d"><span>' + d + (d === dNow ? ' · 오늘' : '') + '</span></div><div class="goal">목표 ' + man(goalOf(d)) + '</div></div>';
        }
      }
      h += has ? '<div class="cell wkc"><div class="d"><span>' + (w + 1) + '주차</span><em style="background:#fff;color:var(--navy)">' + Math.round((wm + wp) / wgPast * 100) + '%</em></div><div class="row"><span>회원권</span><b>' + fmt(wm) + '</b></div><div class="row"><span>PT</span><b>' + fmt(wp) + '</b></div><div class="tot"><span>합계</span><span>' + fmt(wm + wp) + '</span></div></div>'
        : '<div class="cell wkc future"><div class="d"><span>' + (w + 1) + '주차</span></div><div class="goal">목표 ' + man(wg) + '</div></div>';
    }
    h += '</div><div class="bfoot">주간 %는 지난 날 일 목표 합계 대비예요. 데이터: ' + mNum + "월 시트 '매출' 탭</div></div>";

    // 누적 매출 랠리
    const act = []; let ac = 0; for(let d = 1; d <= last; d++){ ac += (data[d] || {}).t || 0; act.push(ac); }
    const W = 640, Hh = 760, L = 58, R = 104, T = 14, B = 30, iw = W - L - R, ih = Hh - T - B, ymax = top3;
    const X = (d)=> L + (d - 1) / (DAYS - 1) * iw, Y = (v)=> T + ih - Math.max(0, v) / ymax * ih;
    let svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" class="cum" role="img" aria-label="누적 매출과 BEST·BASIC·BEP 계획선">';
    [0, .25, .5, .75, 1].forEach((g)=>{ const y = Y(ymax * g); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#eef1f6"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="ax">' + man(ymax * g) + '</text>'; });
    [1, 5, 10, 15, 20, 25, DAYS].forEach((d)=> svg += '<text x="' + X(d) + '" y="' + (Hh - 10) + '" text-anchor="middle" class="ax' + (d === dNow ? ' td' : '') + '">' + d + '</text>');
    svg += '<line x1="' + X(dNow) + '" x2="' + X(dNow) + '" y1="' + T + '" y2="' + (T + ih) + '" stroke="#18338c" stroke-dasharray="3 3" opacity=".5"/>';
    [['best', 'BEST', '6 4'], ['basic', 'BASIC', ''], ['bep', 'BEP', '2 4']].filter((p)=> P[p[0]]).forEach((p)=>{
      svg += '<polyline class="pln' + (p[0] === SEL ? ' on' : '') + '" data-k="' + p[0] + '" fill="none" stroke-width="2" ' + (p[2] ? 'stroke-dasharray="' + p[2] + '"' : '') + ' points="' + P[p[0]].map((v, i)=> X(i + 1) + ',' + Y(v)).join(' ') + '"/>';
      svg += '<text x="' + (W - R + 6) + '" y="' + (Y(P[p[0]][DAYS - 1]) + 4) + '" class="ln' + (p[0] === SEL ? ' on' : '') + '" data-k="' + p[0] + '">' + p[1] + ' ' + man(G[p[0]]) + '</text>';
    });
    if(act.length){
      svg += '<polyline fill="none" stroke="#3b5bd6" stroke-width="3" stroke-linejoin="round" points="' + act.map((v, i)=> X(i + 1) + ',' + Y(v)).join(' ') + '"/>';
      svg += '<circle cx="' + X(last) + '" cy="' + Y(ac) + '" r="5" fill="#3b5bd6" stroke="#fff" stroke-width="2"/><text x="' + (X(last) + 8) + '" y="' + (Y(ac) - 8) + '" class="now">실제 ' + man(ac) + '</text>';
    }
    svg += '</svg>';
    const table = (sel)=>{
      let tb = '<table class="dt"><thead><tr><th>일</th><th>회원권</th><th>PT</th><th>일매출</th><th>누적매출</th><th class="pl">' + NAME[sel] + ' 목표누적</th><th>차이</th><th>' + NAME[sel] + ' 대비</th></tr></thead><tbody>';
      let c2 = 0;
      for(let d = 1; d <= DAYS; d++){
        const past = isPast(d), x = data[d] || { m: 0, p: 0, t: 0 }; if(past) c2 += x.t; const tg = P[sel][d - 1], r = c2 / tg, diff = c2 - tg;
        tb += '<tr class="' + (past ? '' : 'fut') + (d === dNow ? ' today' : '') + '"><td class="' + (isWe(d) ? 'we' : '') + '">' + d + ' ' + wdOf(d) + (d === dNow ? ' · 오늘' : '') + '</td>' +
          (past ? '<td>' + fmt(x.m) + '</td><td class="' + (x.p < 0 ? 'neg' : '') + '">' + fmt(x.p) + '</td><td><b>' + fmt(x.t) + '</b></td><td><b>' + fmt(c2) + '</b></td>' : '<td></td><td></td><td></td><td></td>') +
          '<td class="pl' + (past ? (r >= 1 ? ' hit' : r >= .6 ? ' mid' : ' miss') : '') + '">' + fmt(tg) + '</td>' +
          (past ? '<td class="' + (diff >= 0 ? 'up' : 'dn') + '">' + (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff)) + '</td><td><span class="pill ' + cls(r) + '">' + (r * 100).toFixed(1) + '%</span></td>' : '<td></td><td></td>') + '</tr>';
      }
      return tb + '</tbody><tfoot><tr><td>합계</td><td>' + fmt(sm) + '</td><td>' + fmt(sp) + '</td><td><b>' + fmt(cum) + '</b></td><td></td><td class="pl">' + fmt(G[sel]) + '</td><td></td><td></td></tr></tfoot></table>';
    };
    const opts = [['best', 'BEST'], ['basic', 'BASIC'], ['bep', 'BEP']].filter((o)=> P[o[0]]).map((o)=> '<option value="' + o[0] + '"' + (o[0] === SEL ? ' selected' : '') + '>' + o[1] + ' ' + man(G[o[0]]) + '</option>').join('');
    h += '<div class="card"><h2>누적 매출 랠리 <small>실제 누적 매출이 BEST · BASIC · BEP 계획선 중 어디쯤 있는지</small></h2><div class="rallygrid"><div class="lc">' + svg +
      '<div class="bfoot">목표누적 = 그날까지 누적 매출이 이만큼은 돼야 그 목표를 달성해요 (주말은 하루 ' + man(G.we) + ', 나머지는 평일에 나눠서 쌓음 · 시트와 같은 방식)</div></div>' +
      '<div class="rc"><div class="dtkey"><label class="selbox">기준 <select id="lineSel">' + opts + '</select></label><span><i style="background:var(--gbg)"></i>100% 이상</span><span><i style="background:var(--ybg)"></i>60~99%</span><span><i style="background:var(--rbg)"></i>60% 미만</span><span><i style="background:#eef2fb;border:2px solid #18338c"></i>오늘</span></div>' +
      '<div class="tbwrap" id="rallyTable">' + table(SEL) + '</div></div></div></div></div>';
    $('boardMain').innerHTML = h;
    $('lineSel').addEventListener('change', (e)=>{ SEL = e.target.value; $('rallyTable').innerHTML = table(SEL); document.querySelectorAll('.cum [data-k]').forEach((n)=> n.classList.toggle('on', n.getAttribute('data-k') === SEL)); });
  }

  // ================= 시작 · 5분마다 새로고침 =================
  let timer = null;
  function subBar(){
    $('sub').hidden = false;
    $('sub').innerHTML = '<b>' + mNum + '월 시트</b> 연결됨 · 5분마다 새로고침 <button class="link" id="chg" type="button">시트 바꾸기</button>';
    $('chg').addEventListener('click', ()=>{ if(confirm('이 컴퓨터에 저장된 ' + mNum + '월 시트 연결을 지우고 새로 연결할까요?')){ store.del(); setupView(); } });
  }
  async function refresh(url){
    const [k, s] = await Promise.allSettled([loadSheet(url), loadSales(url)]);
    if(k.status === 'fulfilled') draw(k.value); else $('kpiMain').innerHTML = '<div class="msg">' + esc(k.reason && k.reason.message || '마케팅 KPI 탭을 불러오지 못했어요.') + '</div>';
    if(s.status === 'fulfilled') drawBoard(s.value); else $('boardMain').innerHTML = '<div class="msg">' + esc(s.reason && s.reason.message || '매출 탭을 불러오지 못했어요.') + '</div>';
    return k.status === 'fulfilled' || s.status === 'fulfilled';
  }
  async function start(){
    clearInterval(timer);
    setupMode = false; show(VIEW);
    const url = store.get();
    if(!url){ setupView(); return; }
    if(!(await refresh(url))){ setupView('시트를 불러오지 못했어요. 공유 설정과 주소를 확인해 주세요.'); return; }
    subBar();
    timer = setInterval(()=>{ refresh(url).catch(()=>{}); }, 5 * 60e3);
  }
  start();

})();
</script>
</body>
</html>
