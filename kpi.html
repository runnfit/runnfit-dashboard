<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런앤핏 정릉점 · 마케팅 KPI</title>
<style>
  :root{ --navy:#18338c; --ink:#16213d; --muted:#5d6782; --faint:#9aa1b2; --line:#dfe4ee; --bg:#f3f5f9; --card:#fff;
    --c1:#3b5bd6; --c2:#d9782a; --grid:#eef1f6; --good:#0a7d3c; --bad:#b4232f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font:15px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; display:flex; flex-direction:column; }
  .topbar{ background:var(--navy); color:#fff; height:60px; flex:none; display:flex; align-items:center; gap:22px; padding:0 22px; }
  .topbar .logo{ height:26px; width:auto; display:block; }
  .topbar .where{ font-size:17px; font-weight:700; display:flex; align-items:center; line-height:1; white-space:nowrap; }
  .topbar .where .bar{ opacity:.55; margin:0 4px; font-weight:400; }
  .topbar .tabs{ display:flex; gap:4px; background:rgba(255,255,255,.1); border-radius:12px; padding:4px; }
  .topbar .tab{ font:inherit; font-size:14px; font-weight:800; color:rgba(255,255,255,.75); background:none; border:0; border-radius:9px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
  .topbar .tab.on{ background:#fff; color:var(--navy); cursor:default; }
  main[hidden]{ display:none; }
  .topbar .tab.on:hover{ background:#fff; color:var(--navy); }
  .topbar button.tab:hover{ background:rgba(255,255,255,.18); color:#fff; }
  .topbar .close{ margin-left:auto; font:inherit; font-size:14px; font-weight:700; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:10px; padding:6px 12px; cursor:pointer; }
  .sub{ display:flex; align-items:center; gap:10px; padding:12px 22px 0; font-size:13px; color:var(--muted); }
  .sub b{ color:var(--ink); }
  .sub .link{ font:inherit; font-size:12.5px; font-weight:700; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; }
  main{ flex:1; min-height:0; overflow:auto; padding:12px 22px 22px; }
  .grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; min-width:0; }
  .span2{ grid-column:span 2; } .span4{ grid-column:1 / -1; }
  .lbl{ font-size:13px; font-weight:700; color:var(--muted); }
  .big{ font-size:30px; font-weight:800; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; }
  .big small{ font-size:15px; font-weight:700; color:var(--muted); margin-left:2px; }
  .note{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .note b{ color:var(--ink); }
  .split{ display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:10px; gap:2px; background:var(--grid); }
  .split i{ display:block; height:100%; }
  .keys{ display:flex; gap:12px; font-size:12px; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
  .keys span::before{ content:''; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--k); }
  h2{ margin:0 0 10px; font-size:16px; font-weight:800; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h2 small{ font-size:12.5px; font-weight:600; color:var(--muted); }
  /* 퍼널 */
  .funnel{ display:flex; flex-direction:column; gap:10px; }
  .fr{ display:grid; grid-template-columns:62px minmax(40px,1fr) 40px; align-items:center; gap:8px; }
  .fr .n{ font-weight:700; color:var(--muted); font-size:13px; }
  .fr .b{ display:block; height:26px; background:var(--grid); border-radius:6px; position:relative; }
  .fr .b i{ position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--c1); }
  .fr .v{ text-align:right; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; }
  .conv{ margin:-4px 0 -4px 70px; font-size:12px; font-weight:700; color:var(--muted); }
  .conv b{ color:var(--navy); font-size:13px; }
  /* 막대 그래프 */
  .chart{ position:relative; height:170px; display:flex; align-items:stretch; gap:3px; padding:0 0 20px; border-bottom:1px solid var(--line); }
  .chart.tall{ height:200px; }
  .col{ flex:1; position:relative; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; min-width:0; cursor:default; }
  .col .bar{ width:70%; max-width:22px; display:flex; flex-direction:column-reverse; gap:2px; }
  .col .bar i{ display:block; width:100%; border-radius:4px 4px 0 0; }
  .col .bar i + i{ border-radius:4px 4px 0 0; }
  .col .bar i.neg{ background:#c3c8d4 !important; }
  .col .d{ position:absolute; bottom:-18px; font-size:10.5px; color:var(--faint); white-space:nowrap; }
  .col.we .d{ color:#c2410c; }
  .col.future .bar{ opacity:0; }
  .col.today .d{ color:var(--navy); font-weight:800; }
  .col .lab{ font-size:10px; font-weight:700; color:var(--muted); margin-bottom:2px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .col:hover{ background:#f5f7fc; border-radius:6px; }
  .tip{ position:fixed; z-index:99; pointer-events:none; background:#16213d; color:#fff; font-size:12.5px; line-height:1.5; border-radius:8px; padding:7px 10px; box-shadow:0 6px 18px rgba(0,0,0,.2); display:none; white-space:nowrap; }
  .tip b{ font-weight:800; }
  /* 홍보 */
  .chips{ display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:8px; }
  .chip{ background:#f7f8fb; border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  .chip .lbl{ font-size:12px; }
  .chip .big{ font-size:22px; }
  .setup{ max-width:620px; margin:40px auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 28px; }
  .setup h3{ margin:0 0 6px; font-size:20px; }
  .setup ol{ margin:10px 0 16px; padding-left:20px; color:var(--muted); line-height:1.8; }
  .setup input{ width:100%; font:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  .setup button{ margin-top:10px; font:inherit; font-weight:800; color:#fff; background:var(--navy); border:0; border-radius:10px; padding:10px 18px; cursor:pointer; }
  .setup .err{ color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; }
  .msg{ text-align:center; color:var(--muted); padding:60px 0; }
  /* ===== 경영계기판 ===== */
  :root{ --g:#2fb36b; --gbg:#e3f5ea; --y:#f5b82e; --ybg:#fdf3d8; --r:#e5484d; --rbg:#fde8e8; }
  .bwrap{ display:grid; gap:14px; }
  .dash4{ display:grid; grid-template-columns:1.25fr 1fr 1fr 1fr; gap:14px; }
  .hero .big{ font-size:40px; font-weight:900; } .hero .big small{ font-size:18px; }
  .pbar{ position:relative; height:14px; background:#eef1f6; border-radius:7px; margin:26px 18px 30px 0; }
  .pbar i{ position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--c1); }
  .pbar .tick{ position:absolute; top:-4px; bottom:-4px; border-left:2px dashed #b9c0cf; }
  .pbar .tick span{ position:absolute; top:20px; left:0; transform:translateX(-50%); white-space:nowrap; font-size:11px; color:var(--muted); font-weight:700; }
  .pbar .tick.basic{ border-color:var(--ink); } .pbar .tick.basic span{ color:var(--ink); top:-20px; }
  .pace{ display:flex; gap:8px; flex-wrap:wrap; }
  .pchip{ font-size:12.5px; font-weight:700; border-radius:999px; padding:4px 10px; background:#f1f3f8; color:var(--muted); }
  .pchip.g{ background:var(--gbg); color:#0a6b35; } .pchip.y{ background:var(--ybg); color:#8a5a00; } .pchip.r{ background:var(--rbg); color:#a3232a; }
  .remain .big{ font-size:34px; font-weight:900; }
  .rally{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .rally div{ border-radius:10px; padding:8px 10px; text-align:center; } .rally b{ display:block; font-size:22px; font-weight:900; } .rally span{ font-size:11.5px; font-weight:700; }
  .rally .g{ background:var(--gbg); color:#0a6b35; } .rally .y{ background:var(--ybg); color:#8a5a00; } .rally .r{ background:var(--rbg); color:#a3232a; }
  .gb .top{ display:flex; align-items:baseline; justify-content:space-between; margin-top:6px; }
  .gb .amt{ font-size:32px; font-weight:900; font-variant-numeric:tabular-nums; } .gb .amt small{ font-size:15px; color:var(--muted); font-weight:800; }
  .gb .pct{ font-size:32px; font-weight:900; color:var(--k); }
  .gb .sub2{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); } .gb .sub2 b{ color:var(--ink); }
  .gbar{ position:relative; height:14px; background:#eef1f6; border-radius:7px; margin:12px 0 4px; }
  .gbar i{ position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--k); }
  .gbar .exp{ position:absolute; top:-5px; bottom:-5px; border-left:2px dashed var(--ink); }
  .gl{ position:relative; height:16px; margin-top:8px; font-size:11px; font-weight:700; } .gl span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .stline{ display:inline-block; font-size:12.5px; font-weight:700; border-radius:8px; padding:4px 9px; margin-top:6px; }
  .stline.g{ background:var(--gbg); color:#0a6b35; } .stline.y{ background:var(--ybg); color:#8a5a00; } .stline.r{ background:var(--rbg); color:#a3232a; }
  .legend3{ display:flex; gap:12px; font-size:12px; color:var(--muted); font-weight:600; }
  .legend3 span::before{ content:''; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; background:var(--k); }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr) 1.1fr; gap:6px; }
  .hd{ font-size:13px; font-weight:800; text-align:center; color:var(--muted); padding-bottom:4px; border-bottom:2px solid #c9cfdb; }
  .hd.sat{ color:#2850c8; border-color:#7d97e6; } .hd.sun{ color:#d23a3a; border-color:#ef9a9a; } .hd.wk{ background:#e6ecf8; border-radius:8px 8px 0 0; color:var(--navy); }
  .cell{ border-radius:10px; padding:7px 9px; min-height:96px; background:#fff; border:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .cell.empty{ background:transparent; border:0; }
  .cell .d{ font-size:13px; font-weight:800; display:flex; justify-content:space-between; }
  .cell .d em{ font-style:normal; font-size:11px; font-weight:800; border-radius:6px; padding:0 5px; }
  .cell.sat .d>span{ color:#2850c8; } .cell.sun .d>span{ color:#d23a3a; }
  .cell .row{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:3px; }
  .cell .row b{ color:var(--ink); font-weight:600; } .cell .row.neg b{ color:#a3232a; }
  .cell .tot{ display:flex; justify-content:space-between; font-size:14px; font-weight:900; margin-top:4px; padding-top:4px; border-top:1px solid rgba(0,0,0,.06); }
  .cell.g{ background:var(--gbg); border-color:#bfe6cd; } .cell.g .d em{ background:var(--g); color:#fff; }
  .cell.y{ background:var(--ybg); border-color:#f3dea0; } .cell.y .d em{ background:var(--y); color:#5a3b00; }
  .cell.r{ background:var(--rbg); border-color:#f4c4c6; } .cell.r .d em{ background:var(--r); color:#fff; }
  .cell.today{ outline:3px solid var(--navy); outline-offset:-1px; }
  .cell.future{ background:#fafbfd; color:var(--faint); } .cell.future .goal{ font-size:11.5px; color:var(--faint); margin-top:6px; }
  .wkc{ background:#eef2fb; border-color:#d6def3; } .wkc .d{ color:var(--navy); }
  .bfoot{ font-size:12px; color:var(--muted); margin-top:10px; }
  .rallygrid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; }
  .rallygrid .lc{ display:flex; flex-direction:column; justify-content:space-between; } .cum{ width:100%; height:auto; display:block; }
  .cum .ax{ font-size:12px; fill:#9aa1b2; } .cum .ax.td{ fill:#18338c; font-weight:800; }
  .cum .pln{ stroke:#16213d; opacity:.4; } .cum .pln.on{ opacity:1; stroke-width:2.5; }
  .cum .pln[data-k="best"]{ stroke:#2fb36b; } .cum .pln[data-k="bep"]{ stroke:#e5484d; }
  .cum .ln{ font-size:12px; fill:#16213d; font-weight:700; opacity:.55; } .cum .ln.on{ opacity:1; font-weight:900; }
  .cum .ln[data-k="best"]{ fill:#0a7d3c; } .cum .ln[data-k="bep"]{ fill:#c0262d; } .cum .now{ font-size:14px; fill:#16213d; font-weight:900; }
  .dtkey{ display:flex; gap:14px; font-size:12px; color:var(--muted); margin:2px 0 8px; font-weight:600; align-items:center; flex-wrap:wrap; }
  .dtkey i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-2px; }
  .selbox{ font-weight:800; color:var(--ink); display:inline-flex; align-items:center; gap:6px; margin-right:8px; }
  .selbox select{ font:inherit; font-weight:800; font-size:14px; color:#fff; background:var(--ink); border:0; border-radius:8px; padding:5px 10px; cursor:pointer; }
  .tbwrap{ border:1px solid var(--line); border-radius:10px; }
  .dt{ width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .dt th{ white-space:nowrap; background:#f5f7fb; color:var(--muted); font-weight:800; padding:7px 8px; text-align:right; border-bottom:1px solid var(--line); }
  .dt th:first-child, .dt td:first-child{ text-align:left; }
  .dt td{ white-space:nowrap; padding:3px 8px; text-align:right; border-bottom:1px solid #f1f3f8; }
  .dt td.we{ color:#c2410c; } .dt td.neg{ color:#a3232a; }
  .dt tfoot td{ background:#f5f7fb; font-weight:800; }
  .dt th.pl, .dt td.pl{ background:#f1f4fb; color:var(--ink); font-weight:800; }
  .dt td.pl.hit{ background:var(--gbg); color:#0a6b35; } .dt td.pl.hit::before{ content:'✓ '; }
  .dt td.pl.mid{ background:var(--ybg); color:#8a5a00; } .dt td.pl.miss{ background:var(--rbg); color:#a3232a; }
  .dt td.up{ color:#0a6b35; font-weight:700; } .dt td.dn{ color:#a3232a; font-weight:700; }
  .dt tr.fut td:first-child{ color:#b0b6c3; }
  .dt tr.today td{ border-top:2px solid var(--navy); border-bottom:2px solid var(--navy); background:#eef2fb; } .dt tr.today td:first-child{ color:var(--navy); font-weight:900; }
  .pill{ display:inline-block; min-width:52px; text-align:center; border-radius:6px; padding:1px 6px; font-weight:800; font-size:11.5px; }
  .pill.g{ background:var(--gbg); color:#0a6b35; } .pill.y{ background:var(--ybg); color:#8a5a00; } .pill.r{ background:var(--rbg); color:#a3232a; }
  @media (max-width:1100px){ .dash4{ grid-template-columns:1fr 1fr; } .rallygrid{ grid-template-columns:1fr; } .cal{ gap:4px; } .cell{ padding:5px 6px; } .cell .row{ font-size:11px; } .cell .tot{ font-size:12px; } .hero .big{ font-size:32px; } .remain .big{ font-size:28px; } }
  .dt td.dd{ font-weight:800; font-variant-numeric:tabular-nums; }
  .dt td.dd .dn{ display:inline-block; width:2.1ch; text-align:right; }
  .dt td.dd .dw{ display:inline-block; margin-left:8px; }
  .dt td.dd .tdy{ display:inline-block; margin-left:8px; font-size:11px; color:#fff; background:var(--navy); border-radius:5px; padding:0 6px; }
  .dt tr.fut td.dd{ font-weight:700; }
  .cell.click{ cursor:pointer; transition:transform .1s, box-shadow .1s; } .cell.click:hover{ box-shadow:0 0 0 3px rgba(31,47,138,.25); }
  .dayov{ position:fixed; inset:0; z-index:90; background:rgba(15,23,60,.28); display:flex; justify-content:center; align-items:flex-start; padding:60px 20px; overflow:auto; }
  .dayov[hidden]{ display:none; }
  .dbox{ width:560px; max-width:100%; background:#fff; border-radius:18px; box-shadow:0 18px 50px rgba(11,31,77,.25); padding:18px 20px 14px; }
  .dhd{ display:flex; align-items:center; justify-content:space-between; } .dhd h3{ margin:0; font-size:18px; }
  .dx{ font:inherit; font-size:15px; font-weight:800; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px 10px; cursor:pointer; color:var(--ink); }
  .dtot{ font-size:28px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums; } .dtot small{ font-size:14px; color:var(--muted); }
  .dsplit{ display:flex; gap:14px; font-size:13px; color:var(--muted); } .dsplit b{ color:var(--ink); }
  .dsplit span::before{ content:''; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; background:var(--k); }
  .dmix{ display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; } .dmix span{ font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px; background:#f1f3f8; color:var(--muted); } .dmix b{ color:var(--ink); }
  .dseg{ display:inline-flex; background:#f1f3f8; border-radius:10px; padding:3px; margin:2px 0 10px; }
  .dseg button{ font:inherit; font-size:13px; font-weight:800; padding:5px 16px; border-radius:8px; color:var(--muted); background:none; border:0; cursor:pointer; }
  .dseg button.on{ background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .dgrp{ font-size:12px; font-weight:800; color:var(--muted); margin:10px 0 4px; display:flex; align-items:center; }
  .dgrp::before{ content:''; width:9px; height:9px; border-radius:2px; background:var(--k); margin-right:6px; } .dgrp span:first-child{ margin-right:auto; }
  .dit{ display:grid; grid-template-columns:1fr 50px 100px; gap:8px; padding:6px 2px; border-bottom:1px solid #f1f3f8; align-items:center; font-variant-numeric:tabular-nums; }
  .dit .n{ font-weight:700; } .dit .c{ color:var(--muted); text-align:right; } .dit .a{ text-align:right; font-weight:800; } .dit .bar{ height:6px; border-radius:3px; background:var(--k); margin-top:4px; }
  .dmem{ display:grid; grid-template-columns:70px 74px 1fr 92px; gap:8px; padding:7px 2px; border-bottom:1px solid #f1f3f8; align-items:center; font-variant-numeric:tabular-nums; }
  .dmem .nm{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .dmem .a{ text-align:right; font-weight:800; }
  .dmem .pd{ font-weight:600; } .dmem .pd small{ display:block; color:var(--faint); font-size:11.5px; font-weight:500; }
  .dit .a.neg, .dmem .a.neg{ color:#a3232a; }
  .tag{ font-size:11.5px; font-weight:800; border-radius:6px; padding:2px 4px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag.new{ background:#e6edfb; color:#2850c8; } .tag.re{ background:var(--gbg); color:#0a6b35; } .tag.day{ background:#eef0fa; color:#4b5aa8; }
  .tag.add{ background:#e6f1f2; color:#3f6e74; } .tag.etc{ background:#fff; color:var(--faint); border:1px dashed var(--line); } .tag.pt{ background:#fcebdc; color:#a8521a; } .tag.mem{ background:#f1f3f8; color:var(--muted); }
  .nmb{ font:inherit; font-weight:800; color:var(--navy); background:none; border:0; padding:0; text-align:left; cursor:pointer; text-decoration:underline dotted #b9c0cf; text-underline-offset:3px; }
  .nmb:hover{ color:#2850c8; }
  .mhost{ margin:4px 0 12px; border:2px solid var(--navy); border-radius:14px; padding:10px; background:#f5f7fb; }
  .mbar{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-bottom:8px; } .mbar b{ color:var(--ink); } .mbar .dx{ margin-left:auto; padding:2px 8px; font-size:13px; }
  .mbody{ font-size:13px; color:var(--muted); } .mnote{ font-size:12px; color:var(--muted); margin-top:6px; }
  .dbox{ width:680px; }
  .mc{ display:flex; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; min-height:150px; margin-bottom:8px; }
  .mside{ position:relative; width:170px; flex:none; background:var(--belt); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:12px 8px; }
  .mbelt{ position:absolute; top:7px; right:7px; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); }
  .mav{ width:92px; height:92px; border-radius:50%; background:#fff; padding:4px; box-shadow:0 0 0 1px rgba(11,31,77,.15); }
  .mav img, .mph{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:grid; place-items:center; background:#eef2f9; font-size:36px; }
  .mname{ font-size:17px; font-weight:900; }
  .mmain{ flex:1; min-width:0; padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
  .mtop{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mlast{ font-size:18px; font-weight:900; color:var(--navy); }
  .mreg{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; font-size:12px; font-weight:800; }
  .mlights{ display:flex; gap:4px; background:#1b2547; padding:3px 6px; border-radius:999px; } .mlights i{ width:13px; height:13px; border-radius:50%; background:#6b7392; }
  .mlights i.on{ box-shadow:0 0 0 2px #fff; } .mlights i.r.on{ background:#e5484d; } .mlights i.y.on{ background:#f5c518; } .mlights i.g.on{ background:#3fbf5f; }
  .mtel{ align-self:flex-start; font:inherit; font-size:15px; font-weight:900; color:#0b1f4d; background:#eceef2; border:0; border-radius:6px; padding:3px 9px; cursor:pointer; }
  .mcopied{ font-size:12px; color:#0a7d3c; font-weight:800; }
  .mbox{ background:#eef2f9; border-radius:9px; padding:6px 12px; font-size:16px; display:flex; align-items:center; gap:10px; } .mbox b{ font-weight:900; }
  .msep{ width:2px; height:18px; background:#b7c0d6; }
  .mfoot{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:auto; }
  /* ===== 경영 ===== */
  .bhead .link{ font:inherit; font-size:12.5px; font-weight:700; color:var(--navy); background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .bhead{ display:flex; align-items:center; justify-content:space-between; } .btitle{ font-size:22px; font-weight:900; }
  .bbig{ font-size:30px; font-weight:900; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; } .bbig small{ font-size:15px; color:var(--muted); font-weight:700; }
  .lbl small{ font-weight:600; color:var(--faint); font-size:11.5px; margin-left:4px; }
  .bdelta{ font-size:12.5px; font-weight:700; margin-top:4px; } .bdelta span{ color:var(--muted); font-weight:600; } .bdelta.up{ color:#0a7d3c; } .bdelta.dn{ color:#b4232f; }
  .bspark{ width:100%; height:auto; margin-top:6px; display:block; overflow:visible; } .bspark .sm{ font-size:10px; fill:#9aa1b2; font-weight:700; } .bspark .sm.on{ fill:#16213d; font-weight:900; }
  .bbars{ width:100%; height:auto; display:block; } .bbars .ax{ font-size:11px; fill:#9aa1b2; } .bbars .bv{ font-size:11px; font-weight:800; fill:#16213d; } .bbars .br{ font-size:11px; font-weight:800; }
  .bbars .bmn{ font-size:12.5px; font-weight:700; fill:#16213d; } .bbars .bmn.on{ font-weight:900; } .bbars .bmn.off{ fill:#c3c8d4; }
  .bbars .bm{ cursor:pointer; outline:none; } .bbars .bm:hover > rect:first-of-type, .bbars .bm:focus > rect:first-of-type{ fill:#f5f7fc; }
  .bdet{ display:grid; grid-template-columns:1.6fr 1fr; gap:14px; } .card.sel{ border:2px solid var(--navy); }
  .wf{ width:100%; height:auto; display:block; } .wf .wv{ font-size:12.5px; font-weight:800; fill:#16213d; } .wf .wl{ font-size:12px; fill:#5d6782; font-weight:700; }
  .wf .wp{ font-size:12px; font-weight:800; fill:#9aa1b2; } .wf .wp.c{ fill:#b8322e; } .wf .wp.p{ fill:#2a9d8f; }
  .bline{ padding:10px 0; border-bottom:1px solid #f1f3f8; } .bline > div:first-child{ display:flex; justify-content:space-between; align-items:baseline; } .bline .note{ text-align:right; }
  .bnum{ font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; }
  .bdiag{ margin-top:12px; border-radius:10px; padding:10px 12px; font-weight:800; } .bdiag.r{ background:var(--rbg); color:#a3232a; } .bdiag.y{ background:var(--ybg); color:#8a5a00; } .bdiag.g{ background:var(--gbg); color:#0a6b35; }
  .g3b{ display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:14px; }
  .bdonut{ display:flex; align-items:center; gap:18px; } .bdonut > div{ flex:1; }
  .drow{ display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:13px; } .drow i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; } .drow .m{ color:var(--muted); }
  .bbarsl .r{ display:grid; grid-template-columns:76px 1fr 72px 40px; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid #f1f3f8; font-variant-numeric:tabular-nums; font-size:13px; }
  .bbarsl .t{ height:10px; background:#eef1f6; border-radius:5px; overflow:hidden; } .bbarsl .t i{ display:block; height:100%; border-radius:5px; background:var(--k); }
  .bbarsl .a{ text-align:right; font-weight:800; } .bbarsl .p{ text-align:right; color:var(--muted); font-weight:700; }
  @media (max-width:1100px){ .bdet, .g3b{ grid-template-columns:1fr; } }
  .bctl{ display:flex; align-items:center; gap:10px; }
  .yseg{ display:inline-flex; background:#e9ecf3; border-radius:10px; padding:3px; } .yseg button{ font:inherit; font-size:13px; font-weight:800; color:var(--muted); background:none; border:0; border-radius:8px; padding:5px 14px; cursor:pointer; }
  .yseg button.on{ background:var(--ink); color:#fff; }
  .yy{ margin-left:10px; padding-left:10px; border-left:1px solid var(--line); } .yy.up{ color:#0a7d3c; } .yy.dn{ color:#b4232f; } .yy span{ color:var(--muted); font-weight:600; }
  .note b.up{ color:#0a7d3c; } .note b.dn{ color:#b4232f; }
  .legend3 .ly::before{ height:0 !important; border-top:2px dashed #16213d; opacity:.6; background:none !important; }
  .bspark .sp{ cursor:pointer; outline:none; } .bspark .sp:hover .sm, .bspark .sp:focus .sm{ fill:#16213d; font-weight:900; }
  .spinfo{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-top:4px; padding-top:6px; border-top:1px dashed var(--line); }
  .spinfo b{ color:var(--ink); } .spinfo em{ font-style:normal; font-weight:800; margin-left:4px; } .spinfo em.up{ color:#0a7d3c; } .spinfo em.dn{ color:#b4232f; }
  .bbars .bpy{ font-size:10.5px; font-weight:700; fill:#16213d; opacity:.42; }
</style>

(function(){
  const $ = (id)=> document.getElementById(id);
  const top = window.parent || window;

  const KST = 9 * 3600e3;
  const today = new Date(Date.now() + KST).toISOString().slice(0, 10);
  const month = today.slice(0, 7), mNum = +today.slice(5, 7), dNum = +today.slice(8, 10);
  const KEY = 'runfit_kpi_sheet_' + month;
  const KPI_GID = '1416723171';   // '마케팅 KPI' 탭 (파일을 복사해도 같은 번호가 유지됨)

  const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, (c)=> ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const fmt = (n)=> n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
  const won = (n)=> n == null || isNaN(n) ? '-' : Math.abs(n) >= 10000 ? (n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '만' : fmt(n);
  const pct = (a, b)=> b ? Math.round(a * 100 / b) + '%' : '-';

  function parseCsv(s){
    const rows = []; let r = [], f = '', q = false;
    for(let i = 0; i < s.length; i++){ const c = s[i];
      if(q){ if(c === '"' && s[i + 1] === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
      else if(c === '"') q = true; else if(c === ','){ r.push(f); f = ''; } else if(c === '\n'){ r.push(f); rows.push(r); r = []; f = ''; } else if(c !== '\r') f += c; }

    }
    s += '</svg>';
    h += '<div class="card"><h2>월별 손익 <small>달을 누르면 아래에 그 달 손익 흐름이 나와요</small><span class="legend3" style="margin-left:auto"><span style="--k:#3b5bd6">매출</span><span style="--k:#2a9d8f">영업이익</span><span style="--k:#d9534f">BEP(운영비)</span>' + (PY ? '<span class="ly">작년 매출</span>' : '') + '</span><span class="legend3"><span style="--k:#2fb36b">이익률 15%↑</span><span style="--k:#f5b82e">5~15%</span><span style="--k:#e5484d">5% 미만</span></span></h2>' + s + '</div>';
    // 고른 달: 손익 흐름 + 한눈에
    const i = BSEL, rv = A.rev[i] || 0, ded = rv - (A.net[i] || rv), lb = A.lab[i] || 0, rt = A.rent[i] || 0, fx = A.fix[i] || 0, va = A.vari[i] || 0, rs = A.res[i] || 0, op = A.op[i] || 0, bp = A.bep[i] || (lb + rt + fx + va);

    s2 += '</svg>';
    const r0 = rv ? op / rv : 0, pi = idx[idx.indexOf(i) - 1];
    const diag = r0 < .05 ? (rv > bp ? 'BEP보다 매출이 ' + man(rv - bp) + ' 많지만 부가세·수수료를 빼면 거의 남지 않았어요' : '매출이 BEP보다 ' + man(bp - rv) + ' 적어요') : r0 >= .15 ? '이익률 ' + (r0 * 100).toFixed(1) + '% · 좋은 달이에요' : '이익률 ' + (r0 * 100).toFixed(1) + '% · 보통이에요';

    let a0 = -Math.PI / 2, dn = '<div class="bdonut"><svg viewBox="0 0 180 180" width="160" aria-hidden="true"><g transform="translate(90,90)">';

  async function refreshBiz(){
    const u = bstore.get(); if(!u){ bizSetup(); return; }

  }

  function monthlyFromAnnual(){ const A0 = ANNUAL && ANNUAL[YEAR], l = A0 && A0.links && A0.links[mNum - 1]; return l && /docs\.google\.com\/spreadsheets\/d\//.test(l) ? l : null; }

  async function refresh(url){
    const [k, s] = await Promise.allSettled([loadSheet(url), loadSales(url)]);
    if(k.status === 'fulfilled') draw(k.value); else $('kpiMain').innerHTML = '<div class="msg">' + esc(k.reason && k.reason.message || '마케팅 KPI 탭을 불러오지 못했어요.') + '</div>';

    return k.status === 'fulfilled' || s.status === 'fulfilled';
  }

    const url = store.get() || monthlyFromAnnual();

    timer = setInterval(()=>{ refresh(url).catch(()=>{}); refreshBiz().catch(()=>{}); }, 5 * 60e3);
  }
  start();
