<!DOCTYPE html>
<html lang="ko">
<head>

<title>런앤핏 픽셀 헬스장 3D 체험판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--b:#093692;--b2:#2563EB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07112E;font-family:'Noto Sans KR',sans-serif;color:#111827;touch-action:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
.ui{position:fixed;z-index:5}
#top{top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
#top .chip{pointer-events:auto;background:rgba(255,255,255,.94);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#top .logo{background:var(--b);color:#fff;font-style:italic}
#top .sp{flex:1}
#hint{top:52px;left:50%;transform:translateX(-50%);background:rgba(9,54,146,.92);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s}
#joy{left:22px;bottom:96px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3)}
#bar{left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;background:linear-gradient(transparent,rgba(7,17,46,.85))}
#bar button,.btn{border:0;border-radius:12px;height:46px;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer}
#bar button{flex:1;background:rgba(255,255,255,.95);color:var(--b)}
#bar button.pri{background:var(--b2);color:#fff}
#card{left:50%;transform:translateX(-50%);bottom:236px;width:min(340px,calc(100% - 24px));background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
#card .t{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900}
#card .n{background:var(--b2);color:#fff;border-radius:6px;padding:1px 7px;font-size:14px}
#card .s{font-size:12px;color:#4B5563;margin-top:4px;line-height:1.5}
#card .row{display:flex;gap:6px;margin-top:10px}
#card .row .btn{flex:1;height:40px;font-size:13px}
.btn.p{background:var(--b2);color:#fff}.btn.g{background:#E3E9FF;color:var(--b)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,8,25,.6)}
.sheet{width:min(360px,calc(100% - 24px));background:#fff;border-radius:16px;padding:16px;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{border:0;border-radius:10px;background:#F1F4FA;padding:8px 4px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;line-height:1.3}
.grid button b{display:inline-block;background:var(--b2);color:#fff;border-radius:5px;padding:0 5px;margin-bottom:3px;font-size:11px}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#163a9c,#07112E 70%);color:#fff;text-align:center;padding:24px}
#start .lg{font-size:30px;font-weight:900;font-style:italic;border:3px solid #fff;border-radius:999px;padding:4px 22px}
#start p{color:#C7D3EE;font-size:14px;line-height:1.6;margin:14px 0 18px}
#start input{width:240px;height:48px;border-radius:12px;border:0;padding:0 14px;font-size:16px;font-family:inherit;text-align:center}
#start .btn{width:240px;height:54px;margin-top:10px;font-size:17px}
#start small{margin-top:14px;color:#8FA3D6;font-size:12px}
#face{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(3,8,25,.55)}
.dev{width:230px;padding:14px 12px 18px;border-radius:18px;background:#0B0D12;box-shadow:0 0 0 3px #CBD5E1,0 20px 40px rgba(0,0,0,.5)}
.dev .scr{border-radius:8px;overflow:hidden;background:#0F1E4A;color:#fff}
.dev .tm{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px}
.dev .tm b{font-size:22px;letter-spacing:1px}
.dev .cam{height:170px;background:linear-gradient(#C7D2FE,#E0E7FF);position:relative;display:flex;align-items:center;justify-content:center}
.dev .scan{position:absolute;left:46px;right:46px;height:3px;background:#22D3EE;box-shadow:0 0 10px #22D3EE;animation:sc 1.1s linear infinite}
@keyframes sc{0%{top:20px}50%{top:146px}100%{top:20px}}
.dev .ok{display:flex;align-items:center;gap:10px;padding:10px;background:#1E3A8A;min-height:58px}
.dev .ok i{width:38px;height:38px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;font-weight:900;flex:none}
#skip{right:12px;top:58px;display:none;background:rgba(255,255,255,.9);color:var(--b);border:0;border-radius:999px;padding:8px 14px;font-weight:900;font-family:inherit}
#toast{left:50%;top:96px;transform:translateX(-50%);background:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.3);display:none;white-space:nowrap}
#chatin{display:flex;gap:6px;margin-top:6px}
#chatin input{flex:1;height:44px;border:2px solid #D5DCE8;border-radius:10px;padding:0 10px;font-size:15px;font-family:inherit}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="ui"><span class="chip logo">RUN N FIT</span><span class="chip" id="where">정릉 · 1번 홀</span><span class="sp"></span><span class="chip" id="cnt">지금 0명 / 30명</span></div>
<div id="hint" class="ui">왼쪽 동그라미로 걷고, 화면을 밀어 둘러봐요</div>

<div id="bar" class="ui">
  <button id="bFind" class="pri">📍 기구 찾기</button>
  <button id="bWave">👋 인사</button>
  <button id="bTalk">💬 한마디</button>

<div id="mFind" class="modal"><div class="sheet"><h3>어떤 기구를 찾을까요?</h3><div class="grid" id="eqGrid"></div><button class="btn g" style="width:100%;margin-top:10px" data-close>닫기</button></div></div>
<div id="mTalk" class="modal"><div class="sheet"><h3>접속한 회원에게 한마디</h3><div id="chatin"><input id="msg" maxlength="20" placeholder="예) 오늘도 파이팅!"><button class="btn p" id="send" style="width:70px">보내기</button></div><button class="btn g" style="width:100%;margin-top:10px" data-close>닫기</button></div></div>
<div id="mBook" class="modal"><div class="sheet"><h3>응원 방명록</h3><div id="bookList" style="font-size:13px;line-height:1.7;color:#374151;margin-bottom:8px"></div><div id="chatin"><input id="bookMsg" maxlength="30" placeholder="응원 한 줄 남기기"><button class="btn p" id="bookSend" style="width:70px">남기기</button></div><button class="btn g" style="width:100%;margin-top:10px" data-close>닫기</button></div></div>
<div id="face"><div class="dev"><div style="display:flex;justify-content:center;gap:28px;margin-bottom:8px"><span style="width:8px;height:8px;border-radius:50%;background:#F43F5E"></span><span style="width:8px;height:8px;border-radius:50%;background:#334155"></span><span style="width:8px;height:8px;border-radius:50%;background:#334155"></span><span style="width:8px;height:8px;border-radius:50%;background:#F43F5E"></span></div>
<div class="scr"><div class="tm"><b id="fTime">07:17</b><span id="fDate" style="font-size:10px;opacity:.8"></span></div>
<div class="cam"><div class="scan" id="fScan"></div><svg width="80" height="98" viewBox="0 0 14 17" shape-rendering="crispEdges"><rect x="3" y="0" width="8" height="3" fill="#3B2A1A"/><rect x="3" y="3" width="8" height="6" fill="#F2C9A0"/><rect x="5" y="5" width="1" height="1" fill="#111827"/><rect x="8" y="5" width="1" height="1" fill="#111827"/><rect x="6" y="7" width="2" height="1" fill="#B45309"/><rect x="1" y="10" width="12" height="7" fill="#2563EB"/><rect x="4" y="12" width="6" height="1" fill="#fff"/></svg></div>
<div class="ok" id="fOk"><i style="background:#334155">…</i><div><div style="font-size:14px;font-weight:900">얼굴을 확인하고 있어요</div><div style="font-size:11px;opacity:.85">잠시만요</div></div></div></div></div></div>
<div id="start">
  <div class="lg">RUN N FIT</div>
  <p><b style="color:#fff;font-size:18px">런앤핏 픽셀 헬스장</b><br>실제 정릉 런앤핏 배치 그대로<br>엘리베이터에서 내려 얼굴인식하고 들어가요</p>
  <input id="nick" maxlength="8" placeholder="닉네임">
  <button class="btn p" id="enter">입장하기</button>
  <small>체험판 · 다른 회원은 예시 캐릭터예요</small>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const K = 1.7;                 // 배치도 → 3D 넓힘 배율 (여유 공간)
const s = v => v * K;
const WW = s(18), DG = s(16), RW = 4.2, TD = 6;   // 운동 공간 · 탈의실 줄 · 테라스 깊이
const NEON = 0x3D5AFE;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07112E);
scene.fog = new THREE.Fog(0x07112E, 38, 75);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xc7d2fe, 0x1a1d2a, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(-12, 25, 10); scene.add(sun);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 64 : 50; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.minDistance = 4; controls.maxDistance = 30;
controls.maxPolarAngle = 1.32; controls.minPolarAngle = .35; controls.enableDamping = true;

// ── 재료 / 도형 도우미
const mats = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = o.basic ? new THREE.MeshBasicMaterial({ color: c, transparent: !!o.op, opacity: o.op ?? 1 }) : new THREE.MeshLambertMaterial({ color: c, transparent: !!o.op, opacity: o.op ?? 1 })); };
const BX = new THREE.BoxGeometry(1, 1, 1);
const CY = new THREE.CylinderGeometry(1, 1, 1, 18);
function box(parent, x, y, z, w, h, d, c, o) { const m = new THREE.Mesh(BX, M(c, o)); m.scale.set(w, h, d); m.position.set(x + w / 2, y + h / 2, z + d / 2); parent.add(m); return m; }
function cyl(parent, x, y, z, r, h, c, o) { const m = new THREE.Mesh(CY, M(c, o)); m.scale.set(r, h, r); m.position.set(x, y + h / 2, z); parent.add(m); return m; }
const colliders = [];   // [x0,z0,x1,z1]
function solid(x, z, w, d) { colliders.push([x, z, x + w, z + d]); }

function textSprite(txt, { bg = '#2563EB', fg = '#fff', size = 44, pad = 16, scale = .012, radius = 10, border } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `900 ${size}px 'Noto Sans KR', sans-serif`;
  const w = Math.ceil(g.measureText(txt).width) + pad * 2, h = size + pad * 1.4;
  c.width = w; c.height = h;
  g.font = `900 ${size}px 'Noto Sans KR', sans-serif`;
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, w, h, radius); g.fill(); }
  if (border) { g.strokeStyle = border; g.lineWidth = 4; g.beginPath(); g.roundRect(2, 2, w - 4, h - 4, radius); g.stroke(); }
  g.fillStyle = fg; g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillText(txt, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: true, transparent: true }));
  sp.scale.set(w * scale * .6, h * scale * .6, 1); sp.renderOrder = 5; return sp;
}
function label(parent, txt, x, y, z, o) { const sp = textSprite(txt, o); sp.position.set(x, y, z); parent.add(sp); return sp; }

// ── 기구 정보 (실제 번호 · 위치 안내)
const EQ = {
  1: ['레그프레스', '머신존 아랫줄 맨 오른쪽'], 2: ['이너타이', '머신존 아랫줄'], 3: ['레그컬', '머신존 아랫줄'], 4: ['레그익스텐션', '머신존 아랫줄'], 5: ['몬스터글루트', '머신존 아랫줄 맨 왼쪽'],
  6: ['롱풀', '머신존 가운데 줄 맨 오른쪽'], 7: ['어시스트 풀업', '머신존 가운데 줄 · 기둥 앞'], 8: ['랫풀다운', '머신존 가운데 줄'], 9: ['시티드로우', '머신존 가운데 줄'], 10: ['와이드풀다운', '머신존 가운데 줄 맨 왼쪽'],
  11: ['팩덱플라이', '머신존 윗줄'], 12: ['체스트프레스', '머신존 윗줄'], 13: ['암컬', '머신존 윗줄'], 14: ['숄더프레스', '머신존 윗줄 맨 왼쪽'], 15: ['싯업보드', '머신존 윗줄 오른쪽 끝'], 16: ['백익스텐션', '머신존 윗줄 오른쪽 끝'],
  17: ['인클라인 벤치프레스', '프리웨이트존 아래쪽'], 18: ['벤치프레스', '프리웨이트존 가운데'], 19: ['레그프레스(원판)', '프리웨이트존 · 기둥 위'], 20: ['브이스쿼트', '프리웨이트존 위쪽'],
  21: ['케이블', '왼쪽 위 코너 · 테라스 유리문 옆'], 22: ['스미스머신', '거울벽 첫 번째'], 23: ['파워랙', '거울벽 두 번째'], 24: ['하프랙', '거울벽 세 번째'],
};
const WOD = new Set([1, 8, 9, 12, 14, 15]);   // 예시: 노란띠 A
const eqPos = {};   // 번호 → {x,z}
function numBadge(parent, n, x, y, z) { label(parent, String(n).padStart(2, '0'), x, y, z, { size: 40, pad: 12, scale: .011 }); }
function register(n, x, z) { eqPos[n] = { x, z }; }

// ── 바닥 · 존
function floor(x, z, w, d, c, y = 0) { box(scene, x, y - .1, z, w, .1, d, c); }
floor(0, 0, s(6.3), DG, 0x1E2229);                      // 프리웨이트 (고무)
for (let i = 0; i < s(6.3); i += 1) for (let j = 0; j < DG; j += 1) if ((Math.floor(i) + Math.floor(j)) % 2) floor(i, j, Math.min(1, s(6.3) - i), Math.min(1, DG - j), 0x252A33, .001);
floor(s(6.3), 0, WW - s(6.3), s(4.15), 0x22262E);        // 러닝존
floor(s(6.3), s(4.15), WW - s(6.3), s(12.75) - s(4.15), 0x2A2F3B); // 머신존
floor(s(6.3), s(12.75), s(13.8) - s(6.3), DG - s(12.75), 0x2B2838); // 스트레칭
floor(s(13.8), s(12.75), WW - s(13.8), DG - s(12.75), 0x363A46);   // 인포·입구
floor(WW, 0, RW, DG, 0x30343F);
// 테라스 데크
for (let i = 0; i < WW + RW; i += .5) floor(i, -TD, .48, TD, (i * 2) % 2 ? 0x9A7750 : 0x8B6A45);
box(scene, 0, 0, -TD - .1, WW + RW, .9, .1, 0x9CA3AF); box(scene, -.1, 0, -TD, .1, .9, TD, 0x9CA3AF); box(scene, WW + RW, 0, -TD, .1, .9, TD, 0x9CA3AF);
solid(-5, -TD - 2, WW + RW + 10, 2); solid(-3, -TD, 3, TD); solid(WW + RW, -TD, 3, TD);

// ── 벽
box(scene, -.3, 0, 0, .3, 3.4, DG, 0x14161C); solid(-3, 0, 3, DG);
for (let z = 1; z < DG - 2; z += 3.2) box(scene, -.02, .3, z, .03, 2.5, 2.8, 0x2B3347);   // 거울
box(scene, .01, 3.05, 0, .05, .14, DG, NEON, { basic: 1 });
// 통창 (테라스 쪽, 유리) + 유리문(케이블 옆)
box(scene, 0, 0, -.06, WW + RW, 3.0, .06, 0x93C5FD, { op: .18 });
for (let x = 0; x <= WW + RW; x += 1.5) box(scene, x, 0, -.1, .07, 3.0, .1, 0x94A3B8);
box(scene, 0, 2.95, -.12, WW + RW, .12, .14, 0x94A3B8);
const DOOR = { x0: s(2.6), x1: s(2.6) + 1.6 };
colliders.push([0, -.2, DOOR.x0, .05], [DOOR.x1, -.2, WW + RW, .05]);
box(scene, DOOR.x0, 0, -.12, 1.6, .05, .18, 0x7DD3FC, { basic: 1 });
label(scene, '테라스 유리문', DOOR.x0 + .8, 2.6, -.2, { bg: 'rgba(125,211,252,.95)', fg: '#0C4A6E', size: 30, scale: .011 });
// 앞벽 (낮게 잘라서 안이 보이게) + 입구 구멍
const EN = { x0: s(16.3), x1: WW };
box(scene, 0, 0, DG, EN.x0, 1.0, .2, 0x14161C); solid(0, DG, EN.x0, 2);
box(scene, WW, 0, DG, RW, 1.0, .2, 0x14161C); solid(WW, DG, RW, 2);
box(scene, WW + RW, 0, -.1, .2, 1.0, DG + .3, 0x14161C); solid(WW + RW, 0, 3, DG);

// ── 오른쪽: 운동복·수건함 → 남자 탈의실 → 여자 탈의실 → 게시판 → 개인 샤워장 8칸 (러닝존까지 일자)
function room(z0, z1, name, col, door = true) {
  const g = new THREE.Group(); scene.add(g);
  box(g, WW, 0, z0, .2, 2.6, z1 - z0, 0x0B0D12);              // 문 쪽 벽
  box(g, WW + .2, .001, z0, RW - .2, .02, z1 - z0, col, { op: .35 });
  box(g, WW, 0, z0, RW, 2.6, .1, 0x0B0D12);
  if (door) { const dz = (z0 + z1) / 2 - .45; box(g, WW - .02, 0, dz, .05, 2.1, .9, col); box(g, WW - .04, 2.25, dz, .05, .08, .9, NEON, { basic: 1 }); }
  label(g, name, WW - .3, 2.9, (z0 + z1) / 2, { bg: 'rgba(17,24,39,.85)', size: 30, scale: .011 });
  solid(WW, z0, RW, z1 - z0);
}
const Z = v => s(v);
room(Z(14.0), DG, '운동복·수건함', 0x0EA5E9, false);

// ── 캐릭터 (복셀 · 런앤핏 티셔츠)
function avatar(name, shirt, hair, me) {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const legL = box(body, -.2, 0, -.1, .17, .45, .2, 0x111827), legR = box(body, .03, 0, -.1, .17, .45, .2, 0x111827);
  box(body, -.25, .45, -.15, .5, .5, .3, shirt);
  box(body, -.12, .66, .151, .24, .06, .01, 0xffffff);
  const armL = box(body, -.37, .5, -.08, .12, .42, .16, shirt), armR = box(body, .25, .5, -.08, .12, .42, .16, shirt);
  box(body, -.24, .95, -.2, .48, .44, .4, 0xF2C9A0);
  box(body, -.26, 1.3, -.22, .52, .14, .44, hair); box(body, -.26, 1.05, -.22, .52, .3, .08, hair);
  box(body, -.13, 1.12, .2, .06, .07, .01, 0x111827); box(body, .07, 1.12, .2, .06, .07, .01, 0x111827);
  const tg = textSprite(name, { bg: me ? '#FFD54A' : 'rgba(17,24,39,.85)', fg: me ? '#111827' : '#fff', size: 30, scale: .011 });
  tg.position.y = 1.85; g.add(tg);
  g.userData = { body, legL, legR, armL, armR, phase: Math.random() * 6, bubble: null, bubbleT: 0 };
  scene.add(g); return g;
}
function say(av, txt, sec = 3.5) {
  if (av.userData.bubble) av.remove(av.userData.bubble);
  const b = textSprite(txt, { bg: '#fff', fg: '#111827', size: 32, scale: .011, border: '#111827' });
  b.position.y = 2.3; av.add(b); av.userData.bubble = b; av.userData.bubbleT = sec;
}
function animate(av, moving, dt) {
  const u = av.userData; u.phase += dt * (moving ? 10 : 2);
  const a = moving ? Math.sin(u.phase) * .5 : 0;
  u.legL.rotation.x = a; u.legR.rotation.x = -a; u.armL.rotation.x = -a; u.armR.rotation.x = a;
  u.body.position.y = moving ? Math.abs(Math.sin(u.phase)) * .05 : 0;
  if (u.wave > 0) { u.wave -= dt; u.armR.rotation.z = -2.6 + Math.sin(u.wave * 14) * .4; u.armR.position.y = 1.1; } else { u.armR.rotation.z = 0; u.armR.position.y = .71; }
  if (u.bubble) { u.bubbleT -= dt; if (u.bubbleT <= 0) { av.remove(u.bubble); u.bubble = null; } }
}

const joy = document.getElementById('joy'), knob = document.getElementById('knob');

function jset(e) { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const L = Math.hypot(dx, dy), m = 44; if (L > m) { dx *= m / L; dy *= m / L; } jv = { x: dx / m, y: dy / m }; knob.style.transform = `translate(${dx}px,${dy}px)`; }
joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); jset(e); e.stopPropagation(); });

const $ = id => document.getElementById(id);

let guideTo = null;
const beacon = new THREE.Group(); scene.add(beacon); beacon.visible = false;
{ const c = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, 6, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0x60A5FA, transparent: true, opacity: .22, side: THREE.DoubleSide, depthWrite: false })); c.position.y = 3; beacon.add(c);
  const ar = new THREE.Mesh(new THREE.ConeGeometry(.35, .6, 4), M(0xFFD54A, { basic: 1 })); ar.rotation.x = Math.PI; ar.position.y = 4.2; beacon.add(ar); beacon.userData.ar = ar; }

function openM(id) { $(id).style.display = 'flex'; }

$('bTalk').onclick = () => { openM('mTalk'); setTimeout(() => $('msg').focus(), 50); };
$('send').onclick = () => { const t = $('msg').value.trim(); if (t) { say(me, t, 5); $('msg').value = ''; } closeAll(); };

$('bTerr').onclick = () => { guideTo = { n: 0, x: s(9), z: -2 }; beacon.position.set(s(9), 0, -2); beacon.visible = true; guideLine.visible = true; toast('러닝존 위 유리문으로 나가면 테라스예요'); };
const book = ['새벽러너 · 오늘도 6시 출석 완료!', '스쿼트요정 · 하체 같이해요 🦵', '런관장 · 꾸준함이 최고의 재능!'];
function renderBook() { $('bookList').innerHTML = book.slice(-6).map(t => `· ${t}`).join('<br>'); }
$('bookSend').onclick = () => { const t = $('bookMsg').value.trim(); if (t) { book.push(`${myName} · ${t}`); renderBook(); $('bookMsg').value = ''; toast('방명록에 남겼어요!'); } };

const card = $('card'); let nearKey = '';
function updateCard() {
  if (!entered) { card.style.display = 'none'; return; }
  let best = null, bd = 2.2;
  for (const [n, p] of Object.entries(eqPos)) { const d = Math.hypot(p.x - me.position.x, p.z - me.position.z); if (d < bd) { bd = d; best = +n; } }
  const dBook = Math.hypot(BOOK.x + 1 - me.position.x, BOOK.z + .9 - me.position.z);
  let key = best ? 'eq' + best : dBook < 2.4 ? 'book' : '';
  if (key === nearKey) return; nearKey = key;
  if (!key) { card.style.display = 'none'; return; }
  if (key === 'book') {
    card.innerHTML = `<div class="t">🌿 응원 방명록</div><div class="s">테라스에서 쉬면서 서로 응원 한 줄씩 남겨요</div><div class="row"><button class="btn p" id="cBook">방명록 보기</button></div>`;
    $('cBook').onclick = () => { renderBook(); openM('mBook'); };
  } else {
    const [nm, loc] = EQ[best];
    card.innerHTML = `<div class="t"><span class="n">${String(best).padStart(2, '0')}</span>${nm}${WOD.has(best) ? ' <span style="font-size:11px;background:#FFD54A;border-radius:5px;padding:1px 6px">이번 주 WOD</span>' : ''}</div><div class="s">${loc} · 실제 센터에서도 이 자리에 있어요</div><div class="row"><button class="btn g" id="cHow">사용법 보기</button><button class="btn p" id="cDo">운동하기</button></div>`;
    $('cHow').onclick = () => toast('실제 앱에서는 런관장 사용법 영상이 열려요');
    $('cDo').onclick = () => { say(me, `${nm} 1세트!`, 2.5); me.userData.wave = .8; toast('세트 완료 · 운동 기록에 남았어요 (체험판)'); };
  }
  card.style.display = 'block';
  if (guideTo && best === guideTo.n) { toast(`${nm(best)} 도착!`); beacon.visible = false; guideLine.visible = false; guideTo = null; }
  function nm(n) { return EQ[n][0]; }
}

// ── 입장 연출: 엘리베이터 → 복도 → 얼굴인식 → 턴게이트
let myName = '나';
function setName(n) { myName = n; me.children.filter(c => c.isSprite).forEach(c => me.remove(c)); const tg = textSprite(n, { bg: '#FFD54A', fg: '#111827', size: 30, scale: .011 }); tg.position.y = 1.85; me.add(tg); }
const RANDOM = ['달리는민수', '새싹러너', '정릉불꽃', '오운완요정', '꾸준왕'];
$('nick').value = RANDOM[Math.floor(Math.random() * RANDOM.length)];
$('enter').onclick = () => {
  setName($('nick').value.trim() || '나');
  $('start').style.display = 'none'; $('skip').style.display = 'block'; $('hint').style.opacity = 0;
  cutscene = { t: 0, step: 0 };
};
$('skip').onclick = () => finishEntry(true);
function finishEntry(skip) {
  cutscene = null; entered = true; $('skip').style.display = 'none'; $('face').style.display = 'none';
  armPivot.rotation.y = 0;
  if (skip) { me.position.set(GX + 1.2, 0, GZ - 1.5); }
  follow(1);
  me.rotation.y = Math.PI;
  $('hint').style.opacity = 1; setTimeout(() => $('hint').style.opacity = 0, 5000);
  toast('런앤핏이 기다렸어요! 오늘도 출석 완료 ✓', 3000);
  say(me, '출석 완료!', 3);
}
function runCutscene(dt) {
  const c = cutscene; c.t += dt;
  const walk = (tx, tz, sp = 2.2) => { const dx = tx - me.position.x, dz = tz - me.position.z, d = Math.hypot(dx, dz); if (d < .05) return true; const st = Math.min(d, sp * dt); me.position.x += dx / d * st; me.position.z += dz / d * st; me.rotation.y = Math.atan2(dx, dz); animate(me, true, dt); return false; };
  if (c.step === 0) { const k = Math.min(1, c.t / 1.2); elevL.position.x = (CX0 + CX1) / 2 - .45 - k * .85; elevR.position.x = (CX0 + CX1) / 2 + .45 + k * .85; if (k >= 1) { c.step = 1; say(me, '도착!', 1.5); } }
  else if (c.step === 1) { if (walk(GX + 1.2, GZ + 2.2)) { c.step = 2; c.t = 0; me.rotation.y = Math.PI; openFace(); } }
  else if (c.step === 2) { if (c.t > 1.6 && !c.ok) { c.ok = 1; faceOk(); } if (c.t > 2.8) { $('face').style.display = 'none'; c.step = 3; c.t = 0; } }
  else if (c.step === 3) { armPivot.rotation.y = Math.min(1.5, c.t * 3); if (c.t > .4 && walk(GX + 1.2, GZ - 1.5, 2.0)) { finishEntry(false); } }
  follow(.15);
}
function openFace() {
  const d = new Date(); $('fTime').textContent = d.toTimeString().slice(0, 5);
  $('fDate').textContent = `${d.getMonth() + 1}-${d.getDate()} ${'일월화수목금토'[d.getDay()]}요일`;
  $('fOk').innerHTML = '<i style="background:#334155">…</i><div><div style="font-size:14px;font-weight:900">얼굴을 확인하고 있어요</div><div style="font-size:11px;opacity:.85">카메라를 봐 주세요</div></div>';
  $('fScan').style.display = 'block'; $('face').style.display = 'flex';
}
function faceOk() {
  $('fScan').style.display = 'none';
  $('fOk').innerHTML = `<i>✓</i><div><div style="font-size:15px;font-weight:900">${myName} 님</div><div style="font-size:11px;opacity:.9">안녕하세요! 오늘 23번째 출석</div></div>`;
  fscr.material = M(0x22C55E, { basic: 1 });
  setTimeout(() => fscr.material = M(0x2563EB, { basic: 1 }), 2500);
}

// ── 루프
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  if (cutscene) runCutscene(dt);
  else if (entered || $('start').style.display === 'none') {
    let ix = jv.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
    let iy = jv.y + ((keys.s || keys.arrowdown) ? 1 : 0) - ((keys.w || keys.arrowup) ? 1 : 0);
    const L = Math.hypot(ix, iy);
    if (L > .15) {
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize(); right.crossVectors(fwd, up);
      const mx = (right.x * ix - fwd.x * iy) / Math.max(1, L), mz = (right.z * ix - fwd.z * iy) / Math.max(1, L);
      const sp = 4.2 * dt, ox = me.position.x, oz = me.position.z;
      if (!blocked(ox + mx * sp, oz)) me.position.x += mx * sp;
      if (!blocked(me.position.x, oz + mz * sp)) me.position.z += mz * sp;
      me.rotation.y = Math.atan2(mx, mz);
      follow(1);
      animate(me, true, dt);
    } else animate(me, false, dt);
    updateCard();
  }
  for (const n of NPCS) {
    const { a, path } = n; let moving = false;
    if (path.length > 1) {
      if (n.wait > 0) n.wait -= dt; else {
        const [tx, tz] = path[n.i]; const dx = tx - a.position.x, dz = tz - a.position.z, d = Math.hypot(dx, dz);
        if (d < .1) { n.i = (n.i + 1) % path.length; n.wait = Math.random() * 2; }
        else { const st = Math.min(d, n.speed * dt); a.position.x += dx / d * st; a.position.z += dz / d * st; a.rotation.y = Math.atan2(dx, dz); moving = true; }
      }
    }
    animate(a, moving, dt);
    n.talkT -= dt; if (n.talkT < 0) { n.talkT = 8 + Math.random() * 12; if (n.lines.length) say(a, n.lines[Math.floor(Math.random() * n.lines.length)]); }
  }
  if (beacon.visible) {
    beacon.userData.ar.position.y = 4.2 + Math.sin(clock.elapsedTime * 4) * .25;
    const pts = [new THREE.Vector3(me.position.x, .08, me.position.z), new THREE.Vector3(beacon.position.x, .08, beacon.position.z)];
    guideLine.geometry.setFromPoints(pts); guideLine.computeLineDistances();
    if (guideTo && guideTo.n === 0 && Math.hypot(me.position.x - guideTo.x, me.position.z - guideTo.z) < 2) { toast('테라스 도착! 바람 쐬며 쉬어가요'); beacon.visible = guideLine.visible = false; guideTo = null; }
  }
  $('cnt').textContent = `지금 ${NPCS.length + 1}명 / 30명`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
